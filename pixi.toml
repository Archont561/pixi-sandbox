[workspace]
name = "pixi-sandbox"
version = "0.1.0"
description = "Offline sandboxes for pixi projects: pack, publish to an orphan branch, restore on an airlock"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# ---------------------------------------------------------------------------
# Features are layered so each environment only installs what it needs.
# Everything below was checked against conda-forge (see .knowledge/decisions.md D8).
# ---------------------------------------------------------------------------

[feature.rust.dependencies]
rust = "1.98.*"
cargo-nextest = "*"
cargo-llvm-cov = "*"
cargo-deny = "*"

[feature.docs.dependencies]
biome = "*"
nodejs = "*" # Astro still shells out to node in places

# `bun` has no win-64 build on conda-forge (verified with `pixi lock`: "No candidates
# were found for bun *"). The docs site is built on Linux in CI and on macOS by hand, so
# the dependency is scoped instead of dropping win-64 from the whole workspace.
[feature.docs.target.linux-64.dependencies]
bun = "*"

[feature.docs.target.osx-arm64.dependencies]
bun = "*"

[feature.utils.dependencies]
actionlint = "*"
lefthook = "*"
taplo = "*"
convco = "*"

[feature.sandbox.dependencies]
# The CI-side packer and the airlock-side unpacker. Having them here is convenient for
# local reproduction; CI itself does not depend on this feature — it fetches the same
# helper tools from the binary's embedded sha256 pins (see crates/pixi-sandbox-core/src/tools_lock.rs).
pixi-pack = "*"
pixi-unpack = "*"
rattler-index = "*"

[environments]
default = ["rust"]
dev = { features = ["rust", "utils", "docs", "sandbox"], solve-group = "dev" }
# `ci` deliberately excludes `utils` and `docs`: a CI runner needs cargo + the sandbox
# tools, not git hooks or the docs toolchain.
ci = { features = ["rust", "sandbox"], solve-group = "ci" }
# `bun` has no win-64 build on conda-forge, and the docs site is only ever built on
# Linux (CI) or a developer's mac; the *Rust* workspace still targets all three platforms.
docs = { features = ["docs"], solve-group = "docs" }

# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run -e <env> <task>`. Logic
# lives here (reviewable, runnable locally), not in workflow YAML.
#
# `*-ci` variants read their paths from the environment (the workflow sets them)
# because pixi tasks have no `${VAR:-default}` — plain `$VAR` expands, but a
# missing value expands to an empty string, so those tasks are for callers that
# always set the variables.
# ---------------------------------------------------------------------------

[tasks]
# rust
build = "cargo build --workspace"
test = "cargo nextest run --workspace"
test-doc = "cargo test --workspace --doc"
coverage = "cargo llvm-cov nextest --workspace --lcov --output-path lcov.info"
lint-rust = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all --check"
deny = "cargo deny check"

# config / workflows / docs
lint-actions = "actionlint"
# Keep the checked-in release matrix valid against this binary's embedded helper-tool catalogue.
lint-sandbox-plan = "cargo run -q -p pixi-sandbox -- plan --config .pixi-sandbox.toml --json"
lint-toml = "taplo fmt --check pixi.toml .pixi-sandbox.toml Cargo.toml crates/pixi-sandbox-core/Cargo.toml crates/pixi-sandbox/Cargo.toml crates/pixi-sandbox/pixi.toml crates/pixi-sandbox-git/Cargo.toml deny.toml"
lint-docs = "biome check docs"
# conventional-commit check for the `commit-msg` hook; reads the proposed message from stdin
lint-commit = "convco check --from-stdin"
# one line for the whole lint gate (needs the `dev` environment: rust + utils + docs)
lint = { depends-on = [
  "fmt-check",
  "lint-rust",
  "deny",
  "lint-actions",
  "lint-sandbox-plan",
  "lint-toml",
  "lint-docs",
] }

# docs
docs-install = { cmd = "bun install --frozen-lockfile", cwd = "docs" }
docs-dev = { cmd = "bun run dev", cwd = "docs" }
docs-build = { depends-on = [
  "docs-install",
], cmd = "bun run build", cwd = "docs" }

# the conda package this project ships, installed with
# `pixi global install -c <target-dir> -c conda-forge pixi-sandbox` (decision D8)
package = "pixi publish --path crates/pixi-sandbox --build-dir .publish/build --target-dir .publish/out"

# ---------------------------------------------------------------------------
# The transport pipeline, locally: pack → doctor → publish. These tasks exercise the
# Rust CLI directly, so local runs and CI share the exact command surface.
# The branch now embeds the static Rust binary itself as self-bootstrap.
# ---------------------------------------------------------------------------
sandbox-plan = "cargo run -p pixi-sandbox -- plan --config .pixi-sandbox.toml"
sandbox-build-self = "cargo build -p pixi-sandbox --release"
sandbox-pack = { depends-on = ["sandbox-build-self"], cmd = "cargo run -p pixi-sandbox --release -- pack --repo-root . --envs dev --output-dir .sandbox-out --platform linux-64 --cargo-vendor --fetch-tools --self-bin target/release/pixi-sandbox" }
sandbox-doctor = "cargo run -p pixi-sandbox --release -- doctor --branch-location .sandbox-out --verify"
sandbox-publish = "cargo run -p pixi-sandbox --release -- publish --input-dir .sandbox-out --branch-name sandbox/dev-linux-64 --remote origin"
# One-liner offline reconstruction from orphan branch, with PATH aliases wired
# like setup-pixi.
sandbox-restore = "bash scripts/restore.sh"
# End-to-end airlock proof using the Rust self-binary (replaces old reproduce.sh).
# Packs, verifies, restores into .sandbox-proof, then checks offline assertions.
sandbox-proof = { cmd = """
set -euo pipefail
echo "=== sandbox-proof: pack ==="
cargo run -p pixi-sandbox --release -- pack --repo-root . --envs dev --output-dir .sandbox-out --platform linux-64 --cargo-vendor --fetch-tools --self-bin target/release/pixi-sandbox
echo "=== sandbox-proof: doctor --verify ==="
cargo run -p pixi-sandbox --release -- doctor --branch-location .sandbox-out --verify
echo "=== sandbox-proof: restore via embedded binary ==="
rm -rf .sandbox-proof
mkdir -p .sandbox-proof
# Use the embedded Rust binary from the transport
EMBED=".sandbox-out/.pixi-sandbox/tools/linux-64/pixi-sandbox"
if [ ! -x "$EMBED" ]; then EMBED="target/release/pixi-sandbox"; fi
"$EMBED" restore --branch-location .sandbox-out --output-path .sandbox-proof --force
echo "=== sandbox-proof: offline checks ==="
(
  cd .sandbox-proof
  source .pixi/sandbox-env.sh
  export PATH="$PWD/.pixi/envs/dev/bin:$PATH"
  pixi install --frozen --offline
  cargo build --offline || echo "cargo build --offline failed (expected if no Rust env)"
)
echo "=== sandbox-proof: OK ==="
""", shell = "bash" }

# ---------------------------------------------------------------------------
# The same three Rust CLI steps for CI, taking their paths from the environment so the
# workflow step stays one line:
#   SANDBOX_PROJECT · SANDBOX_ENVS · SANDBOX_TRANSPORT · SANDBOX_PLATFORM
#   SANDBOX_BRANCH · SANDBOX_REMOTE · SANDBOX_SELF_BIN · SANDBOX_PROOF_OUT
# ---------------------------------------------------------------------------
ci-pack = "cargo run -p pixi-sandbox -- pack --repo-root $SANDBOX_PROJECT --envs $SANDBOX_ENVS --output-dir $SANDBOX_TRANSPORT --platform $SANDBOX_PLATFORM $SANDBOX_CARGO_VENDOR --fetch-tools --self-bin $SANDBOX_SELF_BIN"
ci-doctor = "cargo run -p pixi-sandbox -- doctor --branch-location $SANDBOX_TRANSPORT --verify"
ci-publish = "cargo run -p pixi-sandbox -- publish --input-dir $SANDBOX_TRANSPORT --branch-name $SANDBOX_BRANCH --remote $SANDBOX_REMOTE"
ci-proof = { cmd = """
set -euo pipefail
echo "=== ci-proof: pack already done, doctor already done, now restore ==="
rm -rf "$SANDBOX_PROOF_OUT"
mkdir -p "$SANDBOX_PROOF_OUT"
EMBED="$SANDBOX_TRANSPORT/.pixi-sandbox/tools/$SANDBOX_PLATFORM/pixi-sandbox"
if [ ! -x "$EMBED" ]; then EMBED="$SANDBOX_SELF_BIN"; fi
"$EMBED" restore --branch-location "$SANDBOX_TRANSPORT" --output-path "$SANDBOX_PROOF_OUT" --force
(
  cd "$SANDBOX_PROOF_OUT"
  source .pixi/sandbox-env.sh || true
  export PATH="$PWD/.pixi/envs/dev/bin:$PATH"
  pixi install --frozen --offline
  echo "ci-proof: offline install OK"
)
""", shell = "bash" }
