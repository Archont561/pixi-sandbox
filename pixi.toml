[workspace]
name = "pixi-sandbox"
version = "0.4.3"
description = "Offline sandboxes for pixi projects: pack, publish to an orphan branch, restore on an airlock"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# ---------------------------------------------------------------------------
# One development environment (`default`) built from layered features: a change to the rust
# toolchain, the docs toolchain or the lint utilities stays reviewable on its own. Everything
# below was checked against conda-forge (see .knowledge/decisions.md D8).
#
# The second environment, `package`, is deliberately empty and is the only exception — see
# `[environments]` below for why packaging needs an environment that resolves nowhere.
#
# Direct dependencies are pinned exactly (`=version`, not `*`). The sandbox branch is
# published from `pixi.lock` and airlock-restored offline, so a wildcard would let the
# build machine and the airlock resolve to different tool versions. Transitive packages
# are pinned by the lock; bump with `pixi update <name>` and commit the lock diff.
# ---------------------------------------------------------------------------

[feature.rust.dependencies]
rust = "=1.98.1"
cargo-nextest = "=0.9.144"
cargo-llvm-cov = "=0.9.1"
cargo-deny = "=0.20.2"

[feature.web.dependencies]
# The JavaScript toolchain (`bun` plus the docs site and repo dev tools it installs) lives in
# its own feature so the cross-platform `default` environment never has to solve it. `bun` has
# no win-64 build on conda-forge (verified with `pixi lock`: "No candidates were found for bun
# *"), and even on the platforms that do have it, an airlock restoring the published bundle has
# no use for a docs toolchain. `biome` is no longer a conda dependency at all: it is a
# `package.json` devDependency, so the JS tools install from the committed `bun.lock` instead
# of a second, separately-pinned conda source.
bun = "=1.3.11"

[feature.utils.dependencies]
actionlint = "=1.7.12"
lefthook = "=2.1.14"
taplo = "=0.10.0"
convco = "=0.7.2"

[feature.sandbox.dependencies]
# The CI-side packer and the airlock-side unpacker. Having them here is convenient for
# local reproduction; CI itself does not depend on this feature — it fetches the same
# helper tools from the binary's embedded sha256 pins (see crates/pixi-sandbox-core/src/tools_lock.rs).
# Pinned to the same versions the embedded catalogue compiles in, so a local `pack` and a
# CI `pack` cannot pack different helper tools.
pixi-pack = "=0.7.11"
pixi-unpack = "=0.7.11"
rattler-index = "=0.31.5"

[environments]
# `default` is pixi's implicit environment, so a task runs as `pixi run <task>` —
# no `-e` flag in a shell, a git hook or a workflow step. It carries the features a developer
# or the published sandbox branch actually needs, and deliberately NOT `web`: bun (and the node
# tooling it installs) is a win-64 gap and dead weight in the airlock, so it must not be part of
# the environment `--envs default` packs.
default = ["rust", "utils", "sandbox"]
# The JavaScript toolchain. Bun-consuming tasks are declared under `[feature.web.tasks]`, so
# pixi runs them here even when invoked from `default` (e.g. `lint` -> `lint-docs`); callers who
# want the environment explicitly can still write `pixi run -e web <task>`. Not named `docs`
# any more because it also carries the repo-wide dev tools (`backlog`, `skills`) and opencode.
web = ["web"]
# Deliberately empty, and the only reason it exists is that an empty environment needs no
# solve: `pixi run -e package <task>` therefore runs on any runner, including win-64, where
# `default` cannot resolve at all (conda-forge ships no `bun` build — the gap `.knowledge/
# decisions.md` D11 and task-7 record). The release matrix builds one conda package per
# platform (task-23); packaging needs the pixi binary and a Rust toolchain, both of which the
# runner already has, so resolving the development environment would only add a failure mode.
package = []

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run <task>`. Logic lives here
# (reviewable, runnable locally), not in workflow YAML. The packaging pair is the one
# exception and says so with `-e package` (see `[environments]`).
#
# The table is kept deliberately small, which is possible because a pixi task takes
# arguments (minijinja `{{ … }}`, `args = [{ arg = "x", default = "…" }]`):
#
#   * one `xtask` task fronts every repository-automation subcommand — adding one to
#     `crates/xtask` adds no line here;
#   * a check/write or local/CI pair is one task with an argument, not two tasks
#     (`fmt` / `fmt --check`, `lint-docs` / `lint-docs --write`), which is also what
#     retired the `ci-*` twins: their only difference was reading paths from the
#     environment, and an argument with a default says the same thing out loud;
#   * `depends-on` passes arguments too — but ONLY to a task that declares `args`.
#     Passing them to a task that declares none is silently ignored (pixi 0.81), so
#     every task reached with arguments below declares them.
#
# Extra arguments beyond the declared ones go after `--`:
#   pixi run xtask check-conda-platforms dist/conda
#   pixi run fmt --check
# ---------------------------------------------------------------------------

[tasks]
# rust
test = "cargo nextest run --workspace"
test-doc = "cargo test --workspace --doc"
coverage = "cargo llvm-cov nextest --workspace --lcov --output-path lcov.info"
lint-rust = "cargo clippy --workspace --all-targets -- -D warnings"
deny = "cargo deny check"

# `pixi run fmt` rewrites, `pixi run fmt --check` is the gate (what `lint` depends on).
fmt = { args = [
  { arg = "flags", default = "" },
], cmd = "cargo fmt --all {{ flags }}" }

# The typed repository automation (crates/xtask): `check-repository`, `check-release-refs`,
# `check-conda-platforms`, `lint-generated-workflow`, `prepare-release`, `smoke-conda-package`,
# `version`. One task for all of them — a new subcommand needs no new line here, and the
# command a workflow runs is the command you run.
xtask = { args = [
  { arg = "subcommand" },
  { arg = "rest", default = "" },
], cmd = "cargo run -q -p xtask -- {{ subcommand }} {{ rest }}" }

# config / workflows
# Archive the CI-only e2e airlock gate in the connected runner, then replay that exact test
# binary after restore in Tier B (with egress available) and Tier A (through xtask deny-egress).
airlock-gate-archive = { args = [
  { arg = "archive" },
], cmd = "cargo nextest archive -p pixi-sandbox --test e2e --features ci --archive-file {{ archive }}" }
airlock-gate-run = { args = [
  { arg = "archive" },
  { arg = "project" },
  { arg = "transport" },
  { arg = "envs" },
  { arg = "skip_cargo", default = "false" },
], cmd = "PIXI_SANDBOX_GATE_PROJECT={{ project }} PIXI_SANDBOX_GATE_TRANSPORT={{ transport }} PIXI_SANDBOX_GATE_ENVS={{ envs }} PIXI_SANDBOX_GATE_SKIP_CARGO={{ skip_cargo }} cargo nextest run --archive-file {{ archive }} --test-threads=1 'ci_gate::airlock_gate_'" }

lint-actions = "actionlint"
lint-toml = "taplo fmt --check pixi.toml .pixi-sandbox.toml Cargo.toml crates/pixi-sandbox-core/Cargo.toml crates/pixi-sandbox/Cargo.toml crates/pixi-sandbox/pixi.toml crates/pixi-sandbox-git/Cargo.toml crates/xtask/Cargo.toml deny.toml"
# conventional-commit check for the `commit-msg` hook; reads the proposed message from stdin
lint-commit = "convco check --from-stdin"

# one line for the whole lint gate. `lint-docs` is declared under `[feature.web.tasks]`, so pixi
# runs that dependency in the `web` environment while the rest run in `default`.
lint = { depends-on = [
  { task = "fmt", args = [
    "--check",
  ] },
  "lint-rust",
  "deny",
  "lint-actions",
  # actionlint over the workflow `init` GENERATES — a different artifact from this repo's own
  # CI, and the one that shipped broken in v0.3.1 (issue #37, task-12).
  { task = "xtask", args = [
    "lint-generated-workflow",
  ] },
  # keep the checked-in release matrix valid against this binary's embedded tool catalogue
  { task = "sandbox-plan", args = [
    "--json",
  ] },
  "lint-toml",
  "lint-docs",
  # Claims this repository makes about itself that no cargo test may check (D10 keeps tests on
  # the fixtures): crates/ free of references to the deleted prototype, one platform story
  # across the README badge, `pixi.toml` and `.pixi-sandbox.toml`, immutable action pins,
  # agreeing version references, self-contained published actions.
  { task = "xtask", args = [
    "check-repository",
  ] },
] }

# the conda package this project ships, installed with
# `pixi global install -c <target-dir> -c conda-forge pixi-sandbox` (decision D8)
#
# Runs in the empty `package` environment (see `[environments]`), which is how the release
# matrix builds one variant per native runner: the task is the command CI runs, on every
# platform, and the development environment is not a precondition for producing a package.
# Its smoke test is `pixi run -e package xtask smoke-conda-package` — same empty environment,
# same reason.
package = "pixi publish --path crates/pixi-sandbox --build-dir $PIXI_PROJECT_ROOT/.publish/build --target-dir $PIXI_PROJECT_ROOT/.publish/out"

# ---------------------------------------------------------------------------
# The release pipeline (task-36). `release.yml` calls each of these through `-e package` on
# every native runner: the empty packaging environment resolves everywhere (win-64 included,
# where `default` cannot), and the tasks need only the pixi binary and the Rust toolchain the
# runner already has. Anything that was more than one line of workflow shell is an xtask
# subcommand instead (crates/xtask/src/release_assets.rs), so one runtime covers all five
# runners; these three are genuinely one command each.
# ---------------------------------------------------------------------------

# `--target <triple>` (and any other cargo flags) pass through; locally with no flags it is a
# plain host build, which is also what `stage-release-binary` defaults to staging.
build-release-binary = { args = [
  { arg = "flags", default = "" },
], cmd = "cargo build -p pixi-sandbox --release {{ flags }}" }

# The prefix.dev upload the release job runs; the default is the artifact layout that job
# downloads (`dist/conda/conda-<platform>/*.conda`), so the glob stays out of the workflow.
publish-conda = { args = [
  { arg = "files", default = "dist/conda/conda-*/*.conda" },
], cmd = "pixi upload prefix --channel 'archont561/archont561' --generate-attestation {{ files }}" }

# GITHUB_TOKEN pushes (the release commit) trigger no workflows, so the release dispatches the
# docs rebuild explicitly; `GH_TOKEN` reaches gh through the step's `env:`.
dispatch-docs = "gh workflow run docs.yml --ref main"

# auto-release's hand-off to the build half: the release tag is pushed with GITHUB_TOKEN,
# which starts no workflow, so the release build is dispatched explicitly on the new tag.
# One argument fills both the ref and the version input.
dispatch-release = { args = [
  { arg = "tag" },
], cmd = "gh workflow run release.yml --ref {{ tag }} -f version={{ tag }}" }

# The same GITHUB_TOKEN hole, the same hand-off, for the transport: publish-sandbox.yml
# (the sandbox branch repack) runs on push to main, and a GITHUB_TOKEN release-commit push
# starts no workflows — auto-release dispatches the repack explicitly so the published
# branch names the release commit, not the last pre-release push.
dispatch-sandbox-repack = "gh workflow run publish-sandbox.yml --ref main"

# ---------------------------------------------------------------------------
# The airlock proof (.github/workflows/airlock.yml, task-36): these run the RELEASED
# pixi-sandbox — the proof is about published assets, not this tree's build — so they invoke
# the global binary the job installs from the package channel, unlike the `sandbox-*` tasks
# above, which build and run this tree. Arguments carry the workflow's paths (runner temp),
# with the same shapes as the sandbox-* twins.
# ---------------------------------------------------------------------------
airlock-install-released = "pixi global install --channel https://prefix.dev/archont561/archont561 --channel conda-forge pixi-sandbox"
airlock-doctor = { args = [
  { arg = "transport" },
], cmd = "pixi-sandbox doctor --branch-location {{ transport }} --verify" }
airlock-publish = { args = [
  { arg = "transport" },
  { arg = "branch" },
  { arg = "remote" },
], cmd = "pixi-sandbox publish --input-dir {{ transport }} --branch-name {{ branch }} --remote {{ remote }}" }
airlock-restore = { args = [
  { arg = "checkout" },
  { arg = "dest" },
  { arg = "envs" },
], cmd = "pixi-sandbox restore --branch-location {{ checkout }} --output-path {{ dest }} --envs {{ envs }} --force" }

# ---------------------------------------------------------------------------
# The transport pipeline, locally: plan → pack → doctor → publish. These tasks exercise the
# Rust CLI directly, so local runs and CI share the exact command surface. Every path is an
# argument with the local default baked in, which is what replaced the `ci-*` twins: CI passes
# its own values on the same one-line `pixi run`, and nothing reads an environment variable
# that may silently expand to an empty string.
# ---------------------------------------------------------------------------
sandbox-plan = { args = [
  { arg = "flags", default = "" },
], cmd = "cargo run -q -p pixi-sandbox -- plan --config .pixi-sandbox.toml {{ flags }}" }

# The release binary is built first so the transport embeds the self-bootstrap binary this
# tree produces, not a stale one; `&&` rather than a `depends-on` task that exists only to be
# depended on.
sandbox-pack = { args = [
  { arg = "project", default = "." },
  { arg = "envs", default = "default" },
  { arg = "out", default = ".sandbox-out" },
  { arg = "platform", default = "linux-64" },
  { arg = "self_bin", default = "target/release/pixi-sandbox" },
  { arg = "vendor", default = "--cargo-vendor" },
], cmd = "cargo build -q -p pixi-sandbox --release && cargo run -q -p pixi-sandbox --release -- pack --repo-root {{ project }} --envs {{ envs }} --output-dir {{ out }} --platform {{ platform }} {{ vendor }} --fetch-tools --self-bin {{ self_bin }}" }

sandbox-doctor = { args = [
  { arg = "transport", default = ".sandbox-out" },
], cmd = "cargo run -q -p pixi-sandbox --release -- doctor --branch-location {{ transport }} --verify" }

# The branch name must match the reviewed plan (`pixi run sandbox-plan`), or this publishes a
# transport that `scripts/restore.sh` will never look for.
sandbox-publish = { args = [
  { arg = "branch", default = "sandbox/developer-linux-64" },
  { arg = "remote", default = "origin" },
  { arg = "transport", default = ".sandbox-out" },
], cmd = "cargo run -q -p pixi-sandbox --release -- publish --input-dir {{ transport }} --branch-name {{ branch }} --remote {{ remote }}" }

# One-liner offline reconstruction from orphan branch, with PATH aliases wired
# like setup-pixi.
sandbox-restore = "bash scripts/restore.sh"

# ---------------------------------------------------------------------------
# Everything that needs bun. Declared on the `web` feature so pixi runs these in the `web`
# environment — including when they are reached as a `depends-on` of a `default` task, which is
# how `pixi run lint` still covers `lint-docs` without dragging bun into `default`.
# ---------------------------------------------------------------------------
[feature.web.tasks]
# biome is a package.json devDependency (not a conda any more), so the version that runs is the
# one in `bun.lock`. It is invoked through its path rather than `bun x biome` on purpose: the npm
# package's bin is a `#!/usr/bin/env node` shim that execs the platform-native binary, and no conda
# environment in this repo carries node — so `bun x biome` dies with "env: node: No such file or
# directory" exactly like the `bun x backlog` task below. Handing the shim to bun explicitly runs it
# with the bun runtime and needs nothing on PATH, and biome only ever execs the native binary from
# it anyway.
#
# It depends on `docs-install` because biome now arrives from bun.lock rather than from conda: a
# fresh CI runner (or a fresh clone) has no node_modules at all. `bun install --frozen-lockfile`
# is a no-op once installed, so the dependency costs the pre-commit hook milliseconds.
#
# `pixi run lint-docs --write` is the hook's form. It takes no file list: every file the hook
# could pass lives under `docs/`, so checking the directory is the same work and the task stays
# one task instead of a check/write pair.
lint-docs = { args = [
  { arg = "flags", default = "" },
], depends-on = [
  "docs-install",
], cmd = "bun node_modules/@biomejs/biome/bin/biome check {{ flags }} docs" }

# docs. One bun workspace at the repo root (package.json workspaces: ["docs"]), so the install
# runs there and hoists into the root node_modules; `docs/` has no lockfile of its own any more.
#
# The documented version is decided by the tree being built and never written into the pages:
# docs/astro.config.mjs walks up to the root Cargo.toml and reads `[workspace.package] version`
# — the one place the version exists — then substitutes it for every `__VERSION__` at build
# time. That is what lets a release rewrite zero documentation lines (the release repin stamps
# only the README family, which GitHub renders raw).
docs-install = "bun install --frozen-lockfile"
docs = { args = [
  { arg = "mode", default = "build" },
], depends-on = [
  "docs-install",
], cmd = "bun --filter=pixi-sandbox-docs run {{ mode }}" }

# ---------------------------------------------------------------------------
# Bun itself, generically. The repo-wide dev tooling from the root bun workspace
# (`backlog.md`, `skills`) and anything added to `package.json` later needs no dedicated task
# line: `pixi run bunx backlog …`, `pixi run bunx skills …` — everything after the task name
# passes through, which is the append-only shape the per-tool tasks here already used.
#
# `bun x`, never the `bunx` spelling of the command: the conda `bun` package ships no
# `bunx` shim, so the subcommand is the only form that resolves in this environment (it is
# what `bunx` execs elsewhere). `--bun` because these bins carry a `#!/usr/bin/env node`
# shebang and no environment here carries node — the flag hands the bin to the bun runtime
# whatever its shebang says, which is what the per-tool tasks this replaces achieved by
# running the entry files (`node_modules/backlog.md/cli.js`) under bun directly. A bare
# `node_modules/.bin/backlog` in a shell still fails with "env: node: No such file or
# directory" — go through the task.
#
# `bun x` resolves the workspace install before the registry, so the committed `bun.lock`
# still pins what runs — but only once an install exists: `bunx` depends on `docs-install`
# (a no-op once installed) so a fresh clone cannot silently float to npm's latest. `bun`
# stays bare because `pixi run bun install` IS the installer — a self-dependency would loop.
#
# opencode is NOT here: it is a developer tool installed by `.devcontainer/setup.sh` with a
# global `bun add`, so the sandbox branch never carries a 185 MB blob for it and this table
# keeps only what the repository itself is built, tested and released with.
# ---------------------------------------------------------------------------
bun = "bun"
bunx = { depends-on = ["docs-install"], cmd = "bun x --bun" }
