[workspace]
name = "pixi-sandbox"
version = "0.3.7"
description = "Offline sandboxes for pixi projects: pack, publish to an orphan branch, restore on an airlock"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# ---------------------------------------------------------------------------
# One development environment (`default`) built from layered features: a change to the rust
# toolchain, the docs toolchain or the lint utilities stays reviewable on its own. Everything
# below was checked against conda-forge (see .knowledge/decisions.md D8).
#
# The second environment, `package`, is deliberately empty and is the only exception — see
# `[environments]` below for why packaging needs an environment that resolves nowhere.
#
# Direct dependencies are pinned exactly (`=version`, not `*`). The sandbox branch is
# published from `pixi.lock` and airlock-restored offline, so a wildcard would let the
# build machine and the airlock resolve to different tool versions. Transitive packages
# are pinned by the lock; bump with `pixi update <name>` and commit the lock diff.
# ---------------------------------------------------------------------------

[feature.rust.dependencies]
rust = "=1.98.1"
cargo-nextest = "=0.9.144"
cargo-llvm-cov = "=0.9.1"
cargo-deny = "=0.20.2"

[feature.web.dependencies]
# The JavaScript toolchain (`bun` plus the docs site and repo dev tools it installs) lives in
# its own feature so the cross-platform `default` environment never has to solve it. `bun` has
# no win-64 build on conda-forge (verified with `pixi lock`: "No candidates were found for bun
# *"), and even on the platforms that do have it, an airlock restoring the published bundle has
# no use for a docs toolchain. `biome` is no longer a conda dependency at all: it is a
# `package.json` devDependency, so the JS tools install from the committed `bun.lock` instead
# of a second, separately-pinned conda source.
bun = "=1.3.11"

[feature.utils.dependencies]
actionlint = "=1.7.12"
lefthook = "=2.1.14"
taplo = "=0.10.0"
convco = "=0.7.2"

[feature.sandbox.dependencies]
# The CI-side packer and the airlock-side unpacker. Having them here is convenient for
# local reproduction; CI itself does not depend on this feature — it fetches the same
# helper tools from the binary's embedded sha256 pins (see crates/pixi-sandbox-core/src/tools_lock.rs).
# Pinned to the same versions the embedded catalogue compiles in, so a local `pack` and a
# CI `pack` cannot pack different helper tools.
pixi-pack = "=0.7.11"
pixi-unpack = "=0.7.11"
rattler-index = "=0.31.5"

[environments]
# `default` is pixi's implicit environment, so a task runs as `pixi run <task>` —
# no `-e` flag in a shell, a git hook or a workflow step. It carries the features a developer
# or the published sandbox branch actually needs, and deliberately NOT `web`: bun (and the node
# tooling it installs) is a win-64 gap and dead weight in the airlock, so it must not be part of
# the environment `--envs default` packs.
default = ["rust", "utils", "sandbox"]
# The JavaScript toolchain. Bun-consuming tasks are declared under `[feature.web.tasks]`, so
# pixi runs them here even when invoked from `default` (e.g. `lint` -> `lint-docs`); callers who
# want the environment explicitly can still write `pixi run -e web <task>`. Not named `docs`
# any more because it also carries the repo-wide dev tools (`backlog`, `skills`) and opencode.
web = ["web"]
# Deliberately empty, and the only reason it exists is that an empty environment needs no
# solve: `pixi run -e package <task>` therefore runs on any runner, including win-64, where
# `default` cannot resolve at all (conda-forge ships no `bun` build — the gap `.knowledge/
# decisions.md` D11 and task-7 record). The release matrix builds one conda package per
# platform (task-23); packaging needs the pixi binary and a Rust toolchain, both of which the
# runner already has, so resolving the development environment would only add a failure mode.
package = []

# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run <task>`. Logic lives here
# (reviewable, runnable locally), not in workflow YAML. The packaging pair is the one
# exception and says so with `-e package` (see `[environments]`).
#
# `ci-*` variants read their paths from the environment (the workflow sets them)
# because pixi tasks have no `${VAR:-default}` — plain `$VAR` expands, but a
# missing value expands to an empty string, so those tasks are for callers that
# always set the variables.
# ---------------------------------------------------------------------------

[tasks]
# rust
build = "cargo build --workspace"
test = "cargo nextest run --workspace"
test-doc = "cargo test --workspace --doc"
coverage = "cargo llvm-cov nextest --workspace --lcov --output-path lcov.info"
lint-rust = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all --check"
deny = "cargo deny check"

# config / workflows / docs
lint-actions = "actionlint"
# actionlint over the workflow `init` GENERATES — a different artifact from this repo's own
# CI, and the one that shipped broken in v0.3.1 (issue #37, task-12).
lint-generated-workflow = "cargo run -q -p xtask -- lint-generated-workflow"
# Keep the checked-in release matrix valid against this binary's embedded helper-tool catalogue.
lint-sandbox-plan = "cargo run -q -p pixi-sandbox -- plan --config .pixi-sandbox.toml --json"
lint-toml = "taplo fmt --check pixi.toml .pixi-sandbox.toml Cargo.toml crates/pixi-sandbox-core/Cargo.toml crates/pixi-sandbox/Cargo.toml crates/pixi-sandbox/pixi.toml crates/pixi-sandbox-git/Cargo.toml crates/xtask/Cargo.toml deny.toml"
# Claims this repository makes about itself that no cargo test may check (D10 keeps tests on the
# fixtures): crates/ free of references to the deleted prototype, one platform story across
# the README badge, `pixi.toml` and `.pixi-sandbox.toml`, immutable action pins, agreeing
# version references, self-contained published actions. An xtask (crates/xtask/src/repo_checks.rs),
# not a shell script: only the xtask receives the real repository root at runtime; its tests run
# against tempdir fixtures, and one Rust runtime covers every runner (the v0.3.6 release died on
# macOS's Bash 3.2 over a bashism one layer below what actionlint can see).
lint-repo-consistency = "cargo run -q -p xtask -- check-repository"
# conventional-commit check for the `commit-msg` hook; reads the proposed message from stdin
lint-commit = "convco check --from-stdin"
# changelog via convco (conventional commits -> CHANGELOG.md)
changelog = "convco changelog > CHANGELOG.md"
changelog-preview = "convco changelog"
# Resolve the next release version (convco) and stamp Cargo.toml + pixi.toml + internal crate
# pins + Cargo.lock + CHANGELOG.md + the documented release references. Never commits or tags —
# that is the `auto-release` workflow's job (or a reviewer's). Optional selector:
# `pixi run prepare-release auto|major|minor|patch|vX.Y.Z` (default auto).
prepare-release = "cargo run -q -p xtask -- prepare-release"
# one line for the whole lint gate. `lint-docs` is declared under `[feature.web.tasks]`, so pixi
# runs that dependency in the `web` environment while the rest run in `default`.
lint = { depends-on = [
  "fmt-check",
  "lint-rust",
  "deny",
  "lint-actions",
  "lint-generated-workflow",
  "lint-sandbox-plan",
  "lint-toml",
  "lint-docs",
  "lint-repo-consistency",
] }

# the conda package this project ships, installed with
# `pixi global install -c <target-dir> -c conda-forge pixi-sandbox` (decision D8)
#
# Runs in the empty `package` environment (see `[environments]`), which is how the release
# matrix builds one variant per native runner: the task is the command CI runs, on every
# platform, and the development environment is not a precondition for producing a package.
package = "pixi publish --path crates/pixi-sandbox --build-dir $PIXI_PROJECT_ROOT/.publish/build --target-dir $PIXI_PROJECT_ROOT/.publish/out"
# Install what `package` just built and run it here (task-23 AC#2). A package that builds on
# five runners and runs on four is the failure a single-platform build can never see. An xtask,
# not a script: the runner's Rust toolchain (the same one `package` just used) is the one
# runtime all five platforms share — macOS ships Bash 3.2, and one Bash-4 builtin in the old
# script 127'd both darwin legs of the v0.3.6 release.
package-smoke = "cargo run -q -p xtask -- smoke-conda-package"

# ---------------------------------------------------------------------------
# The transport pipeline, locally: pack → doctor → publish. These tasks exercise the
# Rust CLI directly, so local runs and CI share the exact command surface.
# The branch now embeds the static Rust binary itself as self-bootstrap.
# ---------------------------------------------------------------------------
sandbox-plan = "cargo run -p pixi-sandbox -- plan --config .pixi-sandbox.toml"
sandbox-build-self = "cargo build -p pixi-sandbox --release"
sandbox-pack = { depends-on = [
  "sandbox-build-self",
], cmd = "cargo run -p pixi-sandbox --release -- pack --repo-root . --envs default --output-dir .sandbox-out --platform linux-64 --cargo-vendor --fetch-tools --self-bin target/release/pixi-sandbox" }
sandbox-doctor = "cargo run -p pixi-sandbox --release -- doctor --branch-location .sandbox-out --verify"
# The branch name must match the reviewed plan (`pixi run sandbox-plan`), or this publishes a
# transport that `scripts/restore.sh` will never look for.
sandbox-publish = "cargo run -p pixi-sandbox --release -- publish --input-dir .sandbox-out --branch-name sandbox/developer-linux-64 --remote origin"
# One-liner offline reconstruction from orphan branch, with PATH aliases wired
# like setup-pixi.
sandbox-restore = "bash scripts/restore.sh"

# ---------------------------------------------------------------------------
# The same three Rust CLI steps for CI, taking their paths from the environment so the
# workflow step stays one line:
#   SANDBOX_PROJECT · SANDBOX_ENVS · SANDBOX_TRANSPORT · SANDBOX_PLATFORM
#   SANDBOX_BRANCH · SANDBOX_REMOTE · SANDBOX_SELF_BIN
# ---------------------------------------------------------------------------
ci-pack = "cargo run -p pixi-sandbox -- pack --repo-root $SANDBOX_PROJECT --envs $SANDBOX_ENVS --output-dir $SANDBOX_TRANSPORT --platform $SANDBOX_PLATFORM $SANDBOX_CARGO_VENDOR --fetch-tools --self-bin $SANDBOX_SELF_BIN"
ci-doctor = "cargo run -p pixi-sandbox -- doctor --branch-location $SANDBOX_TRANSPORT --verify"
ci-publish = "cargo run -p pixi-sandbox -- publish --input-dir $SANDBOX_TRANSPORT --branch-name $SANDBOX_BRANCH --remote $SANDBOX_REMOTE"

# ---------------------------------------------------------------------------
# Everything that needs bun. Declared on the `web` feature so pixi runs these in the `web`
# environment — including when they are reached as a `depends-on` of a `default` task, which is
# how `pixi run lint` still covers `lint-docs` without dragging bun into `default`.
# ---------------------------------------------------------------------------
[feature.web.tasks]
# biome is a package.json devDependency (not a conda any more), so the version that runs is the
# one in `bun.lock`. It is invoked through its path rather than `bun x biome` on purpose: the npm
# package's bin is a `#!/usr/bin/env node` shim that execs the platform-native binary, and no conda
# environment in this repo carries node — so `bun x biome` dies with "env: node: No such file or
# directory" exactly like the `bun x backlog` task below. Handing the shim to bun explicitly runs it
# with the bun runtime and needs nothing on PATH, and biome only ever execs the native binary from
# it anyway.
#
# Both forms depend on `docs-install` because biome now arrives from bun.lock rather than from
# conda: a fresh CI runner (or a fresh clone) has no node_modules at all, and the first version of
# this task assumed conda would have laid the binary down. `bun install --frozen-lockfile` is a
# no-op once installed, so the dependency costs the pre-commit hook milliseconds.
lint-docs = { depends-on = [
  "docs-install",
], cmd = "bun node_modules/@biomejs/biome/bin/biome check docs" }
# The write form the pre-commit hook uses (`lefthook.yml`), so the hook and the lint gate cannot
# drift onto different biome invocations. `{staged_files}` becomes the task's arguments.
lint-docs-write = { depends-on = [
  "docs-install",
], cmd = "bun node_modules/@biomejs/biome/bin/biome check --write" }

# docs. One bun workspace at the repo root (package.json workspaces: ["docs"]), so the install
# runs there and hoists into the root node_modules; `docs/` has no lockfile of its own any more.
#
# The documented version is decided by the tree being built and never written into the pages:
# docs/astro.config.mjs walks up to the root Cargo.toml and reads `[workspace.package] version`
# — the one place the version exists — then substitutes it for every `__VERSION__` at build
# time. That is what lets a release rewrite zero documentation lines (the release repin stamps
# only the README family, which GitHub renders raw). No SANDBOX_VERSION plumbing here any more:
# the config's own Cargo.toml fallback IS the path, in and outside pixi alike, and the `web`
# environment deliberately carries no cargo for a wrapper script to lean on. The env var still
# wins when a caller must override (`xtask version` prints the same value).
docs-install = "bun install --frozen-lockfile"
docs-dev = { cmd = "bun run dev", cwd = "docs" }
docs-build = { depends-on = [
  "docs-install",
], cmd = "bun run build", cwd = "docs" }

# ---------------------------------------------------------------------------
# opencode: the agent binary. Installed globally with bun, not as a conda dependency, so it is
# on PATH outside a task too and the sandbox branch stays free of a 185 MB blob it would only
# carry for a developer tool.
#
# bun's global bin dir (`bun pm bin -g`, which follows $BUN_INSTALL rather than a hardcoded
# $HOME/.bun/bin) is on nobody's PATH — not the pixi task shell, not a fresh terminal in the dev
# container — so a plain `bun add -g` would leave a binary nobody can invoke. Linking it into a
# directory that already is makes it a global command. /usr/local/bin is tried first (the
# container is root), ~/.local/bin second for a machine where the first needs sudo; when neither
# is writable the install itself still succeeded, so report where it landed rather than failing
# the container over a $PATH detail.
# ---------------------------------------------------------------------------
opencode-install = 'BUN_BIN="$(bun pm bin -g)" && bun add -g opencode-ai@latest && (ln -sfn "$BUN_BIN/opencode" /usr/local/bin/opencode 2> /dev/null || (mkdir -p "$HOME/.local/bin" 2> /dev/null && ln -sfn "$BUN_BIN/opencode" "$HOME/.local/bin/opencode" 2> /dev/null) || echo "opencode installed to $BUN_BIN, which is not on PATH: neither /usr/local/bin nor ~/.local/bin is writable")'
# The model catalogue is a separate cache (`~/.cache/opencode/models.json`, rebuilt from
# models.dev) and a binary upgrade does not invalidate it, so refreshing is a separate step —
# otherwise a new release lists stale models. The absolute path stands: the task shell resolves
# `opencode` only if the link above landed on a PATH entry the shell has, and this one must work
# without it.
setup-opencode = { depends-on = [
  "opencode-install",
], cmd = "\"$(bun pm bin -g)/opencode\" models --refresh" }

# ---------------------------------------------------------------------------
# Repo-wide dev tooling from the root bun workspace (`backlog.md`, `skills`).
# `bun x`, not the `bunx` spelling: the conda `bun` package ships no `bunx` shim, so in this
# environment the subcommand is the only form that resolves (it is what `bunx` execs). `bun x`
# prefers the workspace install over the registry — `bun x astro --version` reports the locked
# 7.3.5, not the newest published — so the committed lockfile still pins what these tasks run.
#
# They have to run under bun at all: both bins carry a `#!/usr/bin/env node` shebang and `web`
# (and `default`) carry no node. Adding one would put ~50 MB of developer tooling into the
# published sandbox branch to carry nothing an airlock restores, so a bare
# `node_modules/.bin/backlog` in a shell fails with "env: node: No such file or directory" — go
# through the task.
# ---------------------------------------------------------------------------
backlog = "bun node_modules/backlog.md/cli.js"
skills = "bun node_modules/skills/bin/cli.mjs"
