version: 2
updates:
  # Rust dependencies (Cargo.toml workspace)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    # Group patch/minor updates to reduce PR noise; major stays separate for review
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # GitHub Actions (pinned to full SHA with trailing # vX comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docs site (Astro + Starlight) — must be `bun`, not `npm`: the build installs with
  # `bun install --frozen-lockfile` against docs/bun.lock. The npm ecosystem cannot read a
  # bun lockfile, so it updated package.json without bun.lock and broke every frozen install.
  - package-ecosystem: bun
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docs-patch:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
