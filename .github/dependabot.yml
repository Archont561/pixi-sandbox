version: 2
updates:
  # Rust dependencies (Cargo.toml workspace)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    # Group patch/minor updates to reduce PR noise; major stays separate for review
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # GitHub Actions (pinned to full SHA with trailing # vX comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Bun workspace (Astro + Starlight docs, plus the repo-wide `backlog.md` / `skills`
  # devDependencies) — must be `bun`, not `npm`: the build installs with
  # `bun install --frozen-lockfile` against the root bun.lock. The npm ecosystem cannot
  # read a bun lockfile, so it updated package.json without bun.lock and broke every
  # frozen install. The directory is `/` because the lockfile is at the root now; the
  # docs site is a workspace member, so its dependencies are covered by the same entry.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docs-patch:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
