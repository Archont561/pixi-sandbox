# Generated by pixi-sandbox init. Regenerate this file instead of editing it.
# Caveat, true since 2026-10-01 and not introduced here: this copy is NOT a pristine render.
# It is the generator's output adapted to build the planner and the packed bootstrap from the
# checked-out source (see the comments on those steps), and nothing checks it against the
# template. The `paths:`, `concurrency:` and `cache:` blocks below are the exact bytes
# `render_github_workflow` emits for `[workflow]` in .pixi-sandbox.toml — change the policy
# there, never here.
name: publish sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".pixi-sandbox.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bun.lock"
      - "crates/**"
      - "package.json"
      - "pixi.lock"
      - "pixi.toml"

permissions:
  contents: write

concurrency:
  group: "publish-sandbox-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          cache: false
      # This repository's publisher follows the checked-out source, including for planning.
      # Consumer workflows generated by `init` intentionally remain release-based.
      - name: Build source pixi-sandbox planner
        run: pixi run -e package build-release-binary
      - id: plan
        shell: bash
        run: echo "matrix=$(target/release/pixi-sandbox plan --config .pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      # `include:` nested under `matrix:`, not `matrix:` itself. `plan --json` emits
      # {"schema":1,"include":[...]}, and Actions requires strategy.matrix to be an object.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          cache: false

      # The publisher is source-fresh: build the checked-out tree on the native runner.
      # Linux must target musl: the packed bootstrap is required to be static (D4), while a
      # host `cargo build --release` produces the dynamically-linked GNU binary.
      # Consumer and airlock workflows intentionally use released binaries instead.
      - name: Build source pixi-sandbox
        id: bootstrap-unix
        if: runner.os != 'Windows'
        shell: bash
        # multiline-run-allowed: host bootstrap — a source build with cross-target rustup selection (musl) that pixi cannot provide; this repository's publisher is deliberately source-fresh, unlike the generated consumer workflow
        run: |
          case "${{ matrix.platform }}" in
            linux-64) target=x86_64-unknown-linux-musl ;;
            linux-aarch64) target=aarch64-unknown-linux-musl ;;
            osx-64) target=x86_64-apple-darwin ;;
            osx-arm64) target=aarch64-apple-darwin ;;
            *) echo "::error::unsupported source-build platform: ${{ matrix.platform }}"; exit 2 ;;
          esac
          rustup target add "$target"
          if [[ "$target" == *-linux-musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
          pixi run -e package build-release-binary -- --target "$target"
          echo "path=$PWD/target/$target/release/pixi-sandbox" >> "$GITHUB_OUTPUT"

      - name: Build source pixi-sandbox
        id: bootstrap-windows
        if: runner.os == 'Windows'
        shell: pwsh
        # multiline-run-allowed: host bootstrap — the Windows half of the same source build (see the Unix step's marker); deliberately source-fresh, not release-based
        run: |
          pixi run -e package build-release-binary
          "path=$((Get-Location).Path)\target\release\pixi-sandbox.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack, verify, and publish
        if: runner.os != 'Windows'
        shell: bash
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          SELF_BIN: ${{ steps.bootstrap-unix.outputs.path }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        # multiline-run-allowed: this repository's publisher is deliberately source-built (the caveat at the top of the file); the generated consumer workflow's `pipeline` verb is the consumer shape
        run: |
          set -euo pipefail
          IFS=',' read -ra ENVS <<< "$ENVIRONMENTS"
          for ENVIRONMENT in "${ENVS[@]}"; do
            pixi install --frozen -e "${ENVIRONMENT//[[:space:]]/}"
          done
          TRANSPORT="$RUNNER_TEMP/pixi-sandbox-transport"
          rm -rf "$TRANSPORT"
          CARGO_VENDOR_ARG=
          if [ "$CARGO_VENDOR" = true ]; then CARGO_VENDOR_ARG=--cargo-vendor; fi
          "$SELF_BIN" pack \
            --repo-root . \
            --envs "$ENVIRONMENTS" \
            --output-dir "$TRANSPORT" \
            --platform "$PLATFORM" \
            --fetch-tools \
            --self-bin "$SELF_BIN" \
            $CARGO_VENDOR_ARG
          "$SELF_BIN" doctor --branch-location "$TRANSPORT" --verify --budget-config .pixi-sandbox.toml
          BASIC_AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH"
          "$SELF_BIN" publish --input-dir "$TRANSPORT" --branch-name "$BRANCH" --remote "$REMOTE"

      - name: Pack, verify, and publish
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          SELF_BIN: ${{ steps.bootstrap-windows.outputs.path }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        # multiline-run-allowed: the PowerShell twin of the same deliberately source-built publisher (see the Bash step's marker)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($environment in ($env:ENVIRONMENTS -split ',')) {
            pixi install --frozen -e $environment.Trim()
          }
          $transport = Join-Path $env:RUNNER_TEMP 'pixi-sandbox-transport'
          Remove-Item -Recurse -Force $transport -ErrorAction SilentlyContinue
          $packArgs = @('pack', '--repo-root', '.', '--envs', $env:ENVIRONMENTS, '--output-dir', $transport, '--platform', $env:PLATFORM, '--fetch-tools', '--self-bin', $env:SELF_BIN)
          if ($env:CARGO_VENDOR -eq 'true') { $packArgs += '--cargo-vendor' }
          & $env:SELF_BIN @packArgs
          & $env:SELF_BIN doctor --branch-location $transport --verify --budget-config .pixi-sandbox.toml
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PUSH_TOKEN")
          $basic = [System.Convert]::ToBase64String($bytes)
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          & $env:SELF_BIN publish --input-dir $transport --branch-name $env:BRANCH --remote $env:REMOTE
