name: publish-sandbox

# Packs environments, proves the payload with `doctor --verify`, then pushes
# it to an orphan branch. Every step is one `pixi run` line, and all its paths come from the
# `SANDBOX_*` variables configured in the `env:` block below (design.md §6).
#
# Runs automatically after `ci` succeeds, or manually via workflow_dispatch,
# or as a reusable workflow via workflow_call.
#
# Packing and publishing run on the *same* runner on purpose: the payload (hundreds of MiB)
# then never has to travel as a build artifact, and the branch is the only place it lands.

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environments:
        description: Comma-separated pixi environments to pack
        type: string
        default: "dev"
      platform:
        description: Target platform for the packed environments
        type: string
        default: "linux-64"
      branch-prefix:
        description: Branch becomes "<prefix>/<platform>" — one branch per platform
        type: string
        default: "sandbox"
      self-binary:
        description: Executable embedded in the branch so it can bootstrap itself
        type: string
        default: ".knowledge/research/pixi_sandbox.py"
      cargo-vendor:
        description: Also vendor the workspace's cargo dependencies
        type: boolean
        default: true
  workflow_call:
    inputs:
      environments:
        description: Comma-separated pixi environments to pack
        type: string
        default: "dev"
      platform:
        description: Target platform for the packed environments
        type: string
        default: "linux-64"
      branch-prefix:
        description: Branch becomes "<prefix>/<platform>" — one branch per platform
        type: string
        default: "sandbox"
      self-binary:
        description: Executable embedded in the branch so it can bootstrap itself
        type: string
        default: ".knowledge/research/pixi_sandbox.py"
      cargo-vendor:
        description: Also vendor the workspace's cargo dependencies
        type: boolean
        default: true
    secrets:
      SANDBOX_PUSH_TOKEN:
        description: Token allowed to force-push the sandbox branches (defaults to GITHUB_TOKEN)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SANDBOX_PROJECT: ${{ github.workspace }}
  SANDBOX_ENVS: ${{ inputs.environments || 'dev' }}
  SANDBOX_PLATFORM: ${{ inputs.platform || 'linux-64' }}
  SANDBOX_TRANSPORT: ${{ github.workspace }}/.sandbox-transport
  SANDBOX_BRANCH: ${{ (inputs.branch-prefix || 'sandbox') }}/${{ inputs.platform || 'linux-64' }}
  SANDBOX_SELF_BIN: ${{ inputs.self-binary || '.knowledge/research/pixi_sandbox.py' }}
  SANDBOX_CARGO_VENDOR: ${{ (inputs.cargo-vendor == false) && '' || '--cargo-vendor' }}
  SANDBOX_REMOTE: https://x-access-token:${{ secrets.SANDBOX_PUSH_TOKEN || github.token }}@github.com/${{ github.repository }}.git

jobs:
  publish:
    name: pack, verify, publish
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: ci
          cache: true
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - run: pixi run -e ci ci-pack
      - run: pixi run -e ci ci-doctor
      - run: pixi run -e ci ci-publish
