name: release

# Build standalone static binaries across tier-1 platforms and publish a
# GitHub Release with SHA256SUMS. The asset contract matches
# `setup/README.md`:
#   pixi-sandbox-{target}{exe}
#   SHA256SUMS (standard `sha256sum` lines)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish (e.g., v0.3.0). When empty on dispatch, only builds artifacts.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi

      - name: Build release binary
        shell: bash
        run: cargo build -p pixi-sandbox --release --target ${{ matrix.target }}

      - name: Strip and stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/pixi-sandbox"
          if [ ! -f "$BIN" ]; then
            echo "::error::Binary not found at $BIN"
            exit 1
          fi
          # Cargo profile already strips (strip = true), but run strip again for minimal size
          strip "$BIN" || true
          ls -lh "$BIN"
          OUT="pixi-sandbox-${TARGET}"
          cp "$BIN" "$OUT"
          chmod +x "$OUT"
          echo "Staged $OUT"
          ls -lh "$OUT"

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "target/$env:TARGET/release/pixi-sandbox.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Binary not found at $bin"
            exit 1
          }
          $out = "pixi-sandbox-$env:TARGET.exe"
          Copy-Item $bin $out -Force
          Get-ChildItem $out | Format-List
          Write-Host "Staged $out"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            pixi-sandbox-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create a Release on tag pushes, or on dispatch when a version is supplied
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          # Deterministic SHA256SUMS matching setup-pixi-sandbox contract
          (cd dist && sha256sum pixi-sandbox-* > SHA256SUMS)
          cat dist/SHA256SUMS
          # Verify that every binary has a checksum line
          for bin in dist/pixi-sandbox-*; do
            [ -f "$bin" ] || continue
            name=$(basename "$bin")
            if ! grep -q "$name" dist/SHA256SUMS; then
              echo "::error::Missing checksum for $name"
              exit 1
            fi
          done

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Stage the install bootstrap script
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Ship the connected-side bootstrapper as a release asset so the documented install
          # one-liner can curl it from an immutable release URL instead of a branch (task-2).
          # It is delivered over `curl | sh` (trust-on-first-use via TLS), so it is intentionally
          # NOT added to SHA256SUMS — SHA256SUMS stays the binary contract setup-pixi-sandbox reads,
          # and init.sh verifies the binary it downloads against it.
          if [ ! -f scripts/init.sh ]; then
            echo "::error::scripts/init.sh not found in the checked-out release ref"
            exit 1
          fi
          # Stamp the version this asset is released under, so `curl …/download/$TAG/init.sh`
          # installs the binaries from that same release instead of whatever default the
          # committed copy carried. Without this, a v0.4.0 init.sh would install v0.3.0 binaries
          # and the one-liner would silently lag a release behind — the exact defect task-2 hit.
          # The committed default still matters for a checkout of a branch, so keep it in sync
          # rather than blanking it.
          cp scripts/init.sh dist/init.sh
          sed -i.bak "s|^VERSION=\${PIXI_SANDBOX_VERSION:-v[0-9.]*}$|VERSION=\${PIXI_SANDBOX_VERSION:-$TAG}|" dist/init.sh
          rm -f dist/init.sh.bak
          # Fail the release rather than ship an asset that installs a different version.
          if ! grep -q "^VERSION=\${PIXI_SANDBOX_VERSION:-$TAG}$" dist/init.sh; then
            echo "::error::could not stamp $TAG into dist/init.sh — check the VERSION line in scripts/init.sh"
            exit 1
          fi
          grep -n '^VERSION=' dist/init.sh
          ls -lh dist/init.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/pixi-sandbox-*
            dist/SHA256SUMS
            dist/init.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
