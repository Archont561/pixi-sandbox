name: release

# Build standalone static binaries across tier-1 platforms and publish a
# GitHub Release with SHA256SUMS. The asset contract matches
# `setup/README.md`:
#   pixi-sandbox-{target}{exe}
#   SHA256SUMS (standard `sha256sum` lines)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish (e.g., v1.2.3). When empty on dispatch, only builds artifacts.
        type: string
        default: ""

permissions:
  contents: write
  # Needed to dispatch docs.yml after publishing the release (see "Trigger docs rebuild").
  actions: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi

      - name: Build release binary
        shell: bash
        run: cargo build -p pixi-sandbox --release --target ${{ matrix.target }}

      - name: Strip and stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/pixi-sandbox"
          if [ ! -f "$BIN" ]; then
            echo "::error::Binary not found at $BIN"
            exit 1
          fi
          # Cargo profile already strips (strip = true), but run strip again for minimal size
          strip "$BIN" || true
          ls -lh "$BIN"
          OUT="pixi-sandbox-${TARGET}"
          cp "$BIN" "$OUT"
          chmod +x "$OUT"
          echo "Staged $OUT"
          ls -lh "$OUT"

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "target/$env:TARGET/release/pixi-sandbox.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Binary not found at $bin"
            exit 1
          }
          $out = "pixi-sandbox-$env:TARGET.exe"
          Copy-Item $bin $out -Force
          Get-ChildItem $out | Format-List
          Write-Host "Staged $out"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            pixi-sandbox-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create a Release on tag pushes, or on dispatch when a version is supplied
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          # Deterministic SHA256SUMS matching setup-pixi-sandbox contract
          (cd dist && sha256sum pixi-sandbox-* > SHA256SUMS)
          cat dist/SHA256SUMS
          # Verify that every binary has a checksum line
          for bin in dist/pixi-sandbox-*; do
            [ -f "$bin" ] || continue
            name=$(basename "$bin")
            if ! grep -q "$name" dist/SHA256SUMS; then
              echo "::error::Missing checksum for $name"
              exit 1
            fi
          done

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Render the install bootstrap script
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/render-install.sh "$TAG" dist/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/pixi-sandbox-*
            dist/SHA256SUMS
            dist/install.sh
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Trigger docs rebuild for the released version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The release commit repins every version reference across docs/** and README, but that
          # commit is pushed with GITHUB_TOKEN, and GitHub suppresses workflow triggers on
          # GITHUB_TOKEN pushes — so docs.yml's `push: [main]` trigger never fires for it and GitHub
          # Pages keeps serving the previous version. Publishing a release is exactly when the site
          # should catch up, so dispatch docs.yml on main here. A workflow_dispatch via the API is
          # not subject to the push-recursion suppression, so GITHUB_TOKEN + actions:write is enough.
          gh workflow run docs.yml --ref main
          echo "::notice::dispatched docs.yml on main to republish the site for $TAG"
          echo "Dispatched **docs.yml** on \`main\` — GitHub Pages will refresh for \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
