name: release

# Build standalone static binaries across tier-1 platforms, build the conda package for each of
# those platforms on its own native runner, and publish a GitHub Release with SHA256SUMS. The
# asset contract matches docs/src/content/docs/installation.mdx (§ Asset contract):
#   pixi-sandbox-{target}{exe}
#   SHA256SUMS (standard `sha256sum` lines, every platform binary)
#
# Every step is a pinned `uses:`, a one-line `pixi run -e package …` task, or a one-line host
# bootstrap (task-36). Staging and checksum logic is tested Rust (`pixi run xtask
# stage-release-binary` / `release-checksums`), so one runtime covers all five runners — this
# workflow used to carry a bash dialect on Unix and a PowerShell dialect on Windows for what
# is the same copy step, and per-platform shell is where the v0.3.6 release died.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish (e.g., v1.2.3). When empty on dispatch, only builds artifacts.
        type: string
        default: ""

# One release build per tag, whatever started it. Since PR #113 removed auto-release's explicit
# `gh workflow run` dispatches, this workflow starts from the tag push itself, so a push and a
# manual `pixi run dispatch-release <tag>` recovery can now overlap: `inputs.version ||
# github.ref_name` collapses both spellings of one tag onto the same group (a tag push gives
# `v1.2.3`; `dispatch-release` passes `--ref v1.2.3 -f version=v1.2.3`), and a dispatch with no
# version — the artifacts-only build — groups per branch instead.
#
# `cancel-in-progress: false` for the same reason auto-release.yml sets it: this builds and
# uploads assets across five runners and then publishes a GitHub Release and the prefix.dev
# packages. Cancelling midway leaves a partial release, which is worse than a redundant one.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to dispatch docs.yml after publishing the release (see "Trigger docs rebuild").
  # docs.yml carries its own `concurrency: pages-${{ github.ref }}` group, so that dispatch
  # cannot race the `push: [main]` trigger it shares a workflow with — it stays as it is.
  actions: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            platform: linux-64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: osx-64
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: osx-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: win-64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Before the build steps, because every remaining step is `pixi run -e package …`: the
      # empty `package` environment is the only one that resolves on every native runner
      # (win-64 included — `default` cannot solve there), and its tasks need only the pixi
      # binary and the Rust toolchain the job already installed.
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          cache: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The `--` is load-bearing: the task takes one positional `flags` arg, so a bare
      # `--target <triple>` is two args and pixi refuses it ("received more arguments than
      # expected") — which is exactly how v0.4.0's build died on all five runners.
      - name: Build release binary
        run: pixi run -e package build-release-binary -- --target ${{ matrix.target }}

      - name: Strip and stage binary
        run: pixi run -e package xtask stage-release-binary ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            pixi-sandbox-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

      # The conda package this release publishes to prefix.dev, built here on the platform's own
      # runner rather than cross-compiled from one Linux job (task-23).
      - name: Build Conda package (${{ matrix.platform }})
        run: pixi run -e package package

      - name: Smoke-test Conda package (${{ matrix.platform }})
        run: pixi run -e package xtask smoke-conda-package

      - name: Upload Conda package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-${{ matrix.platform }}
          path: .publish/out/*.conda
          if-no-files-found: error
          retention-days: 7

  # Proof before publish (doc-13 §2). Everything here runs against the build's own artifact,
  # so it needs no release to exist: a consumer downloads the exact bytes this tag will publish,
  # lets that binary generate a publisher, and proves the pack → publish → fetch → offline
  # restore lifecycle. What it cannot cover is the asset boundary — `releases/download/<tag>`
  # and the published SHA256SUMS do not exist yet — and that boundary keeps its own job in
  # consumer-proof.yml, dispatched after the release below.
  #
  # Job-level `permissions:` *replaces* the workflow-level block, so `contents: read` is the
  # whole grant here; this job is deliberately not in `environment: release`.
  consumer-proof:
    name: consumer proof (linux-64, built artifact)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROOF_LABEL: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Prepare clean consumer fixture
        shell: bash
        # multiline-run-allowed: consumer fixture setup is intentionally isolated from repo tasks
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/evidence"
          mkdir -p "$RUNNER_TEMP/consumer/.github/workflows" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/consumer/.pixi"
          cat > "$RUNNER_TEMP/consumer/pixi.toml" <<'EOF'
          [workspace]
          name = "consumer-proof"
          channels = ["https://prefix.dev/conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          # A dependency-free environment solves to no platform-specific lock entry at all
          # (pixi omits per-platform data when there is nothing to record), so pixi-pack later
          # fails with "platform not found in lockfile: linux-64" and an empty candidate list.
          # One small, fast-to-fetch package (same choice as tests/fixtures/demo-project) is
          # enough to make the environment real without slowing the proof down.
          ripgrep = "*"
          EOF
          printf '%s\n' "consumer fixture: $PROOF_LABEL" > "$RUNNER_TEMP/consumer/README.md"

      - name: Download the built binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/binary

      - name: Adopt the built binary as the consumer's CLI
        run: install -m 0755 "$RUNNER_TEMP/binary/pixi-sandbox-x86_64-unknown-linux-musl" "$RUNNER_TEMP/consumer/pixi-sandbox"

      - name: Record the binary's own version
        shell: bash
        # multiline-run-allowed: two evidence writes, the first under an empty environment
        run: |
          env -i HOME="$RUNNER_TEMP/consumer-home" PATH=/usr/bin:/bin "$RUNNER_TEMP/consumer/pixi-sandbox" --version | tee "$RUNNER_TEMP/evidence/version.txt"
          "$RUNNER_TEMP/consumer/pixi-sandbox" --help > "$RUNNER_TEMP/evidence/help.txt"

      - name: Render and regenerate consumer workflow
        shell: bash
        # multiline-run-allowed: the proof must exercise the released CLI in a clean consumer
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          HOME="$RUNNER_TEMP/consumer-home" "$RUNNER_TEMP/consumer/pixi-sandbox" init --force
          cp .github/workflows/publish-sandbox.yml "$RUNNER_TEMP/evidence/publish-sandbox.first.yml"
          HOME="$RUNNER_TEMP/consumer-home" "$RUNNER_TEMP/consumer/pixi-sandbox" init --force
          cmp .github/workflows/publish-sandbox.yml "$RUNNER_TEMP/evidence/publish-sandbox.first.yml"
          cp .github/workflows/publish-sandbox.yml "$RUNNER_TEMP/evidence/publish-sandbox.yml"
          grep -F 'fetch-release --dest' .github/workflows/publish-sandbox.yml
          grep -F 'SHA256SUMS' .github/workflows/publish-sandbox.yml

      - name: Prove pack, publish, fetch, and offline restore lifecycle
        shell: bash
        # multiline-run-allowed: released-binary consumer lifecycle is the proof subject
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          transport="$RUNNER_TEMP/transport"
          remote="$RUNNER_TEMP/consumer-proof.git"
          checkout="$RUNNER_TEMP/fresh-checkout"
          restored="$RUNNER_TEMP/restored"
          isolated_home="$RUNNER_TEMP/consumer-home"
          cd "$consumer"
          git init --initial-branch=main
          git config user.name consumer-proof
          git config user.email consumer-proof@example.invalid
          HOME="$isolated_home" pixi lock
          git add README.md pixi.toml pixi.lock pixi-sandbox.toml restore.sh .github/workflows
          git commit -m 'test: consumer fixture'
          HOME="$isolated_home" pixi install --frozen
          HOME="$isolated_home" ./pixi-sandbox pack --repo-root . --envs default --output-dir "$transport" --platform linux-64 --fetch-tools --self-bin ./pixi-sandbox | tee "$RUNNER_TEMP/evidence/pack.log"
          ./pixi-sandbox doctor --branch-location "$transport" --verify | tee "$RUNNER_TEMP/evidence/doctor.log"
          git init --bare "$remote"
          ./pixi-sandbox publish --input-dir "$transport" --branch-name sandbox/consumer-proof-linux-64 --remote "$remote" | tee "$RUNNER_TEMP/evidence/publish.log"
          git clone "$remote" "$checkout"
          git -C "$checkout" fetch origin sandbox/consumer-proof-linux-64
          git -C "$checkout" checkout --detach FETCH_HEAD
          # restore requires --output-path to already exist (support::existing_dir) — the
          # e2e fixture tests mkdir it first for the same reason.
          mkdir -p "$restored"
          env -i HOME="$isolated_home" PATH=/usr/bin:/bin "$checkout/.pixi-sandbox/tools/linux-64/pixi-sandbox" restore --branch-location "$checkout" --output-path "$restored" --user-tools skip | tee "$RUNNER_TEMP/evidence/restore.log"
          env -i HOME="$isolated_home" PATH=/usr/bin:/bin "$restored/.pixi/tools/linux-64/pixi" --version | tee "$RUNNER_TEMP/evidence/restored-pixi-version.txt"
          cp "$transport/.pixi-sandbox/manifest.json" "$RUNNER_TEMP/evidence/manifest.json"

      - name: Upload consumer proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-proof-${ env.PROOF_LABEL }
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: publish prefix.dev and GitHub Release
    needs: [build, consumer-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: write
    # Create a Release on tag pushes, or on dispatch when a version is supplied
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}

      # The artifact gates and the checksums below are xtask commands, so this job compiles
      # xtask once with the runner's toolchain; the cache keeps that to seconds on repeat runs.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          cache: false

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Scoped to the binary artifacts: without a pattern this also pulls the five
          # `conda-*` artifacts, and `merge-multiple` would flatten five identically-named
          # .conda files into one.
          pattern: binary-*
          merge-multiple: true

      # One directory per platform, deliberately NOT merged: all five packages carry the same
      # filename (`<name>-<version>-<build>_<n>.conda`), so a flat merge would silently overwrite
      # four of them and the release would publish one platform's bytes five times.
      - name: Download the Conda packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/conda
          pattern: conda-*

      # A platform that silently produced nothing must fail the release, not ship four packages
      # and a GitHub Release that looks complete (task-23 AC#4). The build matrix has
      # fail-fast: false so one broken platform does not hide the others' results — this is where
      # that turns into a red build instead of a quiet gap.
      - name: Require one Conda package per platform
        run: pixi run -e package xtask check-conda-platforms dist/conda

      # The binary twin of the check above. `release-checksums` hashes whatever it finds and
      # refuses only an empty directory, so without this a release missing one platform would
      # publish a green SHA256SUMS covering four binaries — which is exactly where v0.6.1 sat
      # when its osx-64 leg failed to upload its artifact (doc-13 §1.3).
      - name: Require one standalone binary per platform
        run: pixi run -e package xtask check-release-binaries dist

      # SHA256SUMS covers every standalone binary (the `.conda` packages have their own
      # prefix.dev/GitHub Release integrity path), and the xtask re-reads the written file to
      # prove every binary has a line — the completeness check the shell did with grep.
      - name: Generate SHA256SUMS
        run: pixi run -e package xtask release-checksums dist

      # prefix.dev uses the job's short-lived GitHub OIDC identity. Configure Repository
      # Access for this repository's `release.yml` workflow on archont561/archont561;
      # no PREFIX_API_KEY or other long-lived publishing secret is needed. The guard turns a
      # missing permission into a named error before `pixi upload` fails opaquely.
      - name: Verify GitHub OIDC permission
        shell: bash
        run: ': "${ACTIONS_ID_TOKEN_REQUEST_URL:?missing GitHub OIDC request URL; grant permissions.id-token: write}" && : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?missing GitHub OIDC request token; grant permissions.id-token: write}"'

      # All five platform variants, from the per-platform artifact directories. One upload of the
      # whole set keeps prefix.dev consistent with the GitHub Release below, which carries the
      # same bytes from the same directories.
      - name: Publish Conda packages to prefix.dev
        run: pixi run -e package publish-conda

      # GitHub Release is created only after the canonical prefix.dev package upload succeeds.
      # The tag is `inputs.version` on a dispatch, the pushed tag's own name on a tag push —
      # the release job only runs when one of the two is present.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            dist/pixi-sandbox-*
            dist/conda/**/*.conda
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

      # The full consumer proof already gated this release above. What is left to prove is the
      # asset boundary itself, which only exists now that the release does. A release created
      # with GITHUB_TOKEN emits no follow-on `release: published` run, so dispatch the smoke
      # explicitly; workflow_dispatch is not subject to recursion suppression.
      - name: Trigger consumer proof for the released version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run -e package dispatch-consumer-proof ${{ inputs.version || github.ref_name }}

      # Regenerate the release-pinned starter template from the release that just published.
      # Dispatched for the same reason as the consumer proof above: a release created with
      # GITHUB_TOKEN emits no `release: published` event. The hand-off carries the tag *and*
      # the immutable commit, which starter.yml re-resolves against the published release
      # before it touches the starter repository (doc-10).
      - name: Regenerate the release-pinned starter template
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run -e package dispatch-starter ${{ inputs.version || github.ref_name }} ${{ github.sha }}

      # The release commit repins every version reference across docs/** and README, but that
      # commit is pushed with GITHUB_TOKEN, and GitHub suppresses workflow triggers on
      # GITHUB_TOKEN pushes — so docs.yml's `push: [main]` trigger never fires for it and GitHub
      # Pages keeps serving the previous version. Publishing a release is exactly when the site
      # should catch up, so dispatch docs.yml on main here. A workflow_dispatch via the API is
      # not subject to the push-recursion suppression, so GITHUB_TOKEN + actions:write is enough.
      - name: Trigger docs rebuild for the released version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run -e package dispatch-docs
