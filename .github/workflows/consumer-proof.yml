name: consumer proof

# The asset-boundary smoke, and only that.
#
# Everything else the consumer proof used to prove — that a released binary generates a
# consumer publisher, regenerates it byte-identically, and survives the pack → publish → fetch →
# offline restore lifecycle — now runs *before* the release, inside `release.yml`, against the
# build's own artifact (doc-13 §2). That half needs no release to exist, so it can gate the
# publish instead of reporting on it afterwards.
#
# What cannot move is the boundary itself: `releases/download/<tag>` and the published
# `SHA256SUMS` do not exist until the release does. This job is the one place that proves a
# consumer can download and checksum-verify what a release actually published. It therefore
# cannot gate its own release; a red run here is the next release's blocker.
#
# `release.yml` dispatches this explicitly after publishing, because a release created with
# GITHUB_TOKEN emits no `release: published` event. The `on: release` trigger stays for a
# release cut by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to prove, for example v0.5.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: consumer-proof-${{ github.event.release.tag_name || inputs.release-tag || github.ref }}
  cancel-in-progress: true

jobs:
  consumer-proof:
    name: consumer proof (asset boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify standalone release asset
        shell: bash
        # multiline-run-allowed: this is the release-boundary proof, not repository automation
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::release-tag must be a semver tag"; exit 2 ;; esac
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/consumer-home"
          base="${GITHUB_SERVER_URL}/${RELEASE_REPO}/releases/download/${RELEASE_TAG}"
          asset=pixi-sandbox-x86_64-unknown-linux-musl
          curl --fail --location --silent --show-error "$base/$asset" --output "$RUNNER_TEMP/consumer/pixi-sandbox"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output "$RUNNER_TEMP/consumer/SHA256SUMS"
          grep "  $asset$" "$RUNNER_TEMP/consumer/SHA256SUMS" | sed "s#  $asset\$#  $RUNNER_TEMP/consumer/pixi-sandbox#" | sha256sum --check --status -
          chmod +x "$RUNNER_TEMP/consumer/pixi-sandbox"
          env -i HOME="$RUNNER_TEMP/consumer-home" PATH=/usr/bin:/bin "$RUNNER_TEMP/consumer/pixi-sandbox" --version | tee "$RUNNER_TEMP/evidence/version.txt"
          "$RUNNER_TEMP/consumer/pixi-sandbox" --help > "$RUNNER_TEMP/evidence/help.txt"
          cp "$RUNNER_TEMP/consumer/SHA256SUMS" "$RUNNER_TEMP/evidence/SHA256SUMS"

      - name: Upload consumer proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-proof-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 14
