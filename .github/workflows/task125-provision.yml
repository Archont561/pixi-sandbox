# Temporary connected dependency bootstrap, explicitly approved for TASK-125.
# No release, environment publication, commit, branch or PR mutation.
name: TASK-125 source provisioning

on:
  push:
    branches: [arena/aeb1dc12-pixi-sandbox]
    paths:
      - .github/workflows/task125-provision.yml
      - scripts/task125-provision.mjs
      - research/task125-dependencies/**

permissions:
  contents: read

concurrency:
  group: task125-source-provisioning
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Write only unreferenced Git blobs containing public, checksum-verified
      # registry archives. No dependency archives are added to the source history.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: default
          cache: true
      - name: Provision genuine registry archives for the airlocked developer
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run --frozen -- bun scripts/task125-provision.mjs
