name: ci

# Every step in this file is ONE line: `pixi run -e <env> <task>`.
#
# The rule (design.md §6): a step that needs more than one line is a task in `pixi.toml`
# (or a script under `.knowledge/research/`) — never inline bash here. That keeps the
# workflow reviewable, and it means the exact command CI runs is the command you run
# locally. Tasks that need paths from the workflow read them from the environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: ci (lint · test · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pixi run -e dev lint
      - run: pixi run -e dev test
      - run: pixi run -e dev test-doc
      - run: pixi run -e dev coverage
      - uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pixi run -e dev docs-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7
