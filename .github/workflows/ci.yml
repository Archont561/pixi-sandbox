name: ci

# Every step in this file is ONE line: `pixi run -e <env> <task>`.
#
# The rule (design.md §6): a step that needs more than one line is a task in `pixi.toml`
# (or a script under `.knowledge/research/`) — never inline bash here. That keeps the
# workflow reviewable, and it means the exact command CI runs is the command you run
# locally. Tasks that need paths from the workflow read them from the environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: ci (lint · test · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: dev
          cache: true
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - run: pixi run -e dev lint
      - run: pixi run -e dev test
      - run: pixi run -e dev test-doc
      - run: pixi run -e dev coverage
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pixi run -e dev docs-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7
