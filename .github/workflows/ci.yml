name: ci

# Every step in this file is ONE line: `pixi run -e <env> <task>`.
#
# The rule (design.md §6): a step that needs more than one line is a task in `pixi.toml`
# (or a script under `.knowledge/research/`) — never inline bash here. That keeps the
# workflow reviewable, and it means the exact command CI runs is the command you run
# locally. Tasks that need paths from the workflow read them from the environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  lint:
    name: lint (rust · workflows · toml · docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: dev
          cache: true
      # fmt-check + clippy -D warnings + cargo deny + actionlint + hermetic Action tests +
      # root publish-plan/catalogue validation + taplo + biome
      - run: pixi run -e dev lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: ci
          cache: true
      - run: pixi run -e ci test
      - run: pixi run -e ci test-doc
        if: runner.os == 'Linux'

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: ci
          cache: true
      - run: pixi run -e ci coverage
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: docs
          cache: true
      - run: pixi run -e docs docs-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Airlock proof: CI's Rust ci-pack/ci-doctor/ci-publish tasks exercise the native
  # implementation. This separate network-severed bootstrap proof still uses the portable
  # self binary carried in the branch until static Rust release assets are validated for every
  # target (design.md §9).
  # ---------------------------------------------------------------------------
  design-proof:
    name: airlock bootstrap proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
      # `runner.*` is not available in a job-level env block, so the proof's output
      # directory is set on the step that needs it.
      - run: pixi run -e ci ci-proof
        env:
          SANDBOX_PROOF_OUT: ${{ runner.temp }}/sandbox-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: design-proof-transport
          path: ${{ runner.temp }}/sandbox-proof/transport/.pixi-sandbox/manifest.json
          retention-days: 14
