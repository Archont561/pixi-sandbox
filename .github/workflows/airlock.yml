# Native airlock proof: pack a transport on the runner the plan names, publish it to a
# throwaway local remote, restore it, and prove the restore needs no network.
#
# Why this is not `ci.yml`: `ci` proves the code builds and the tests pass. This proves the
# *claim the project sells* — that a machine with no network can reconstruct a working
# environment from a git branch — on the native runner for each platform. A green `ci` on
# ubuntu says nothing about macOS, which is the whole of TASK-1.
#
# Two tiers, and the distinction matters:
#   Tier B runs the gate with the network reachable. It is a smoke test.
#   Tier A runs the same gate with egress actually denied, which is the authoritative check.
# Only Tier A can fail for the reason we care about. The gate is the e2e test suite's
# `ci`-feature airlock module: it is archived while connected, replayed from that archive after
# restore, and compares the restored tree against the manifest's per-file digests (D13).
# Tier B's no-op check cannot be trusted on its own: `pixi install --offline` is a request, not
# an enforcement, and can re-fetch a damaged prefix over a live network while reporting success.
#
# Nothing here touches a real branch or a real remote: the publish step targets a bare repo
# under the runner's own temp directory, so the proof is self-contained and safe on a PR.
#
# Every step is a pinned `uses:` or a one-line `pixi run` (task-36): the matrix emission, the
# release-tag resolution, the pack orchestration, the branch fetch and the egress denial are
# tested xtask commands (crates/xtask/src/airlock.rs). The restored-project gate is now a
# Cargo nextest archive of the e2e suite's `ci` feature, so both tiers execute the same test
# binary instead of shell.

name: airlock

on:
  workflow_call:
    inputs:
      bundle:
        type: string
        description: Bundle from .pixi-sandbox.toml, or `custom` with the inputs below.
        required: false
        default: ""
      platform:
        type: string
        description: Target platform for a custom proof, e.g. osx-arm64.
        required: false
        default: ""
      envs:
        type: string
        description: Comma-separated environments for a custom proof.
        required: false
        default: ""
      branch-prefix:
        type: string
        description: Branch prefix for a custom proof.
        required: false
        default: ""
      cargo-vendor:
        type: string
        description: Vendor cargo dependencies into the transport (custom proof only).
        required: false
        default: ""
      block-network:
        type: boolean
        description: Run the authoritative egress-denied tier.
        required: false
        default: true
  workflow_dispatch:
    inputs:
      platform:
        type: string
        description: Target platform, e.g. linux-64 or osx-arm64. Empty uses .pixi-sandbox.toml.
        required: false
        default: ""
      envs:
        type: string
        description: Comma-separated environments. Required with `platform`.
        required: false
        default: ""
      bundle:
        type: string
        description: Bundle name for a custom proof. Defaults to `custom`.
        required: false
        default: custom
      branch-prefix:
        type: string
        description: Branch prefix for a custom proof. Defaults to `sandbox`.
        required: false
        default: sandbox
      cargo-vendor:
        type: string
        description: Vendor cargo dependencies into the transport.
        required: false
        default: "true"
      block-network:
        type: boolean
        description: Run the authoritative egress-denied tier.
        default: true
  schedule:
    # Weekly, off the hour. A native macOS runner is roughly ten times a Linux one, so this is
    # the cheapest cadence that still catches a platform regression between releases.
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "crates/**"
      - "pixi.toml"
      - "scripts/restore.sh"
      - ".pixi-sandbox.toml"
      - ".github/workflows/airlock.yml"

permissions:
  contents: read

concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: validate airlock plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.tag.outputs.resolved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      # The plan binary is built from source, not downloaded: the plan is what decides which
      # runner this proof runs on, so it must be the plan this commit ships. The proof job
      # separately installs the *released* binary, because a real airlock starts from a
      # released asset.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # The project is checked out into project/, not the job root. This is
          # setup-pixi's own input: the step-level `working-directory` key is only
          # valid on `run:` steps and actionlint rejects it on an action step (#16).
          working-directory: project
          environments: default
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The Cargo workspace is in project/, not the job root.
          workspaces: project

      - name: Build the plan binary
        working-directory: project
        run: pixi run -e default cargo build --release -q -p pixi-sandbox

      # airlock-matrix invokes the plan binary (config mode, or override mode when `--envs`
      # names a target), validates that `.include` is a non-empty array, and writes
      # `matrix=` to $GITHUB_OUTPUT itself — the whole plan object, because the proof job
      # reads `fromJSON(...).include` and every other key would become an illegal dimension.
      - name: Emit the native matrix
        id: plan
        working-directory: project
        run: pixi run xtask airlock-matrix -- --envs "${{ inputs.envs || '' }}" --platform "${{ inputs.platform || '' }}" --bundle "${{ inputs.bundle || '' }}" --branch-prefix "${{ inputs.branch-prefix || '' }}" --cargo-vendor "${{ inputs.cargo-vendor || '' }}"

      # Resolved here, once, on the one job that already has the toolchain: the proof job
      # consumes `needs.plan.outputs.tag` and stays free of a Rust build for everything the
      # released binary can do itself.
      #
      # The tag is derived, not hardcoded. A literal here (`'v0.3.0'`) is stale the moment a release
      # lands and nobody notices: the proof keeps exercising old binaries and reports green, which
      # is the worst failure mode a proof can have. It is read from the checked-out Cargo.toml, the
      # same declaration `prepare-release` stamps, so the two cannot disagree — confirmed against
      # the releases API, because `auto-release` pushes the bump to main before the build exists.
      # `vars.SANDBOX_RELEASE_VERSION` overrides it when a specific release should be exercised.
      - name: Resolve the release tag to prove
        id: tag
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run xtask resolve-release-tag -- --repo "${{ github.repository }}" --override "${{ vars.SANDBOX_RELEASE_VERSION }}"

  proof:
    name: airlock ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Only `.include` is a matrix. `plan --json` also emits a scalar `schema` version, and
      # Actions reads every other key as a dimension that must be an array, so handing it the
      # whole object silently yields zero jobs.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    env:
      # `inputs` is null on `pull_request` and `schedule`, and in GitHub expressions
      # `null == false` is true — so the previous spelling, `inputs.block-network == false`,
      # resolved to 'false' on exactly the two triggers that actually fire, and Tier A was
      # skipped on every run this workflow has ever done. The authoritative tier has to be
      # opt-out, never opt-in, so absent input means blocked; only an explicit `false` from a
      # dispatch or a caller turns it off.
      BLOCK_NETWORK: ${{ inputs.block-network == null && 'true' || (inputs.block-network && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      # run-install: false and the empty `package` environment for every xtask step: the proof
      # job solves no development environment (win-64 cannot solve `default` at all), and the
      # xtask runtime needs only the Rust toolchain the runner carries — the same shape the
      # release matrix's build legs use.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: project

      # The connected side compiles the CI-only gate once and stores a nextest archive. Both
      # proof tiers replay this exact archive after restore, so the egress-denied tier does not
      # need to build Rust code or consult the network.
      - name: Archive the CI e2e airlock gate
        working-directory: project
        run: pixi run --frozen airlock-gate-archive "${{ runner.temp }}/airlock-gate.tar.zst"

      # A real airlock begins with a checksum-verified released binary, so that is what the
      # proof uses — both to drive the pack and as the self-bootstrap embedded in the transport.
      # The channel install is the documented installation path, and the version proof is the
      # first thing the released binary does on this runner.
      - name: Install the released pixi-sandbox package
        working-directory: project
        run: pixi run -e package airlock-install-released

      - name: Prove the released binary runs
        run: pixi-sandbox --version

      # ---------------------------------------------------------------- pack and publish
      # Into a bare repo under the runner's temp dir. `publish` force-pushes an orphan branch,
      # which is the real code path, but the remote is disposable so a PR run cannot disturb
      # the real sandbox branches. It has to exist before the push, hence the ordering.
      - name: Create the throwaway remote
        run: git init -q --bare "${{ runner.temp }}/airlock-remote.git"

      # airlock-pack installs every named environment frozen (the loop the shell did), finds
      # the released binary on PATH, and packs with it as the self-bootstrap — the vendor flag
      # is data from the matrix, which is why this is an xtask and not a plain task.
      - name: Pack the transport with the released binary
        working-directory: project
        run: pixi run -e package xtask airlock-pack -- --envs "${{ matrix.environments }}" --out "${{ runner.temp }}/airlock-transport" --cargo-vendor "${{ matrix.cargo_vendor }}"

      - name: Verify the transport
        working-directory: project
        run: pixi run -e package airlock-doctor "${{ runner.temp }}/airlock-transport"

      - name: Publish to the throwaway remote
        working-directory: project
        run: pixi run -e package airlock-publish "${{ runner.temp }}/airlock-transport" "${{ matrix.branch }}" "${{ runner.temp }}/airlock-remote.git"

      # The developer-shaped fetch: fresh host repo, remote, one shallow fetch, linked
      # worktree — git through pixi-sandbox-git inside the xtask (D9).
      - name: Fetch the published branch the way a developer would
        working-directory: project
        run: pixi run -e package xtask airlock-fetch -- --remote "${{ runner.temp }}/airlock-remote.git" --branch "${{ matrix.branch }}" --host-dir "${{ runner.temp }}/airlock-host" --worktree "${{ runner.temp }}/airlock-checkout"

      - name: Verify every declared byte before trusting the checkout
        working-directory: project
        run: pixi run -e package airlock-doctor "${{ runner.temp }}/airlock-checkout"

      # ---------------------------------------------------------------- restore
      # `restore` in place over a copy of the project, which is the situation the airlock page
      # describes: a developer has the repository and reconstructs the environment under it.
      # `PIXI_SANDBOX_USER_TOOLS=skip` is explicit (task-33): this is a shared CI runner, and
      # the proof must not edit the runner's home or profile. The policy travels as an
      # environment variable, not a flag, because the `pixi-sandbox` driven here is the one
      # the published branch ships — it may predate `--user-tools`, and an unknown variable is
      # ignored where an unknown flag is a hard error. The restore output must be
      # identical either way — registration is a post-verification step, not payload.
      - name: Copy the project for the restore
        run: cp -r project "${{ runner.temp }}/restored"

      - name: Restore into a copy of the project
        working-directory: project
        env:
          PIXI_SANDBOX_USER_TOOLS: skip
        run: pixi run -e package airlock-restore "${{ runner.temp }}/airlock-checkout" "${{ runner.temp }}/restored" "${{ matrix.environments }}"

      # ---------------------------------------------------------------- the gate
      # The restored-project gate is a nextest archive of the e2e suite built with
      # `--features ci`. The restored project, branch checkout, environment list and cargo-vendor
      # policy are explicit inputs; missing inputs fail before a false-positive pass is possible.
      - name: Tier B — gate with the network reachable
        working-directory: project
        run: pixi run --frozen airlock-gate-run "${{ runner.temp }}/airlock-gate.tar.zst" "${{ runner.temp }}/restored" "${{ runner.temp }}/airlock-checkout" "${{ matrix.environments }}" "${{ matrix.cargo_vendor && 'false' || 'true' }}"

      # deny-egress re-execs the same archived tests under `sudo unshare -n` on Linux and
      # `sudo sandbox-exec` with outbound denied on macOS, and fails loudly on any other OS — a
      # proof that ran with the network reachable would be a green build that proves nothing.
      - name: Tier A — gate with egress denied
        if: ${{ env.BLOCK_NETWORK == 'true' }}
        working-directory: project
        run: pixi run -e package xtask deny-egress -- pixi run --frozen airlock-gate-run "${{ runner.temp }}/airlock-gate.tar.zst" "${{ runner.temp }}/restored" "${{ runner.temp }}/airlock-checkout" "${{ matrix.environments }}" "${{ matrix.cargo_vendor && 'false' || 'true' }}"
