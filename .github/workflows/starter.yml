name: starter

# Regenerate and publish the release-pinned starter template (doc-10, TASK-74).
#
# The starter is a consumer artifact: every file in it is either generated by one published
# pixi-sandbox release or rendered from that release's tag. This workflow never invents
# content — it downloads the released binary, verifies it against the release's own
# SHA256SUMS, and lets that binary generate the owned files.
#
# Every step below is a pinned `uses:` or a one-line task (task-36). The scaffolding,
# verification and publication logic is tested Rust in `crates/xtask/src/starter.rs`, not
# shell: `consumer-proof.yml` proves the same recipe but spends ~60 lines of `run:` blocks
# behind `multiline-run-allowed` opt-outs to do it, and per-platform shell is where the v0.3.6
# release died.
#
# Triggered explicitly by release.yml after the GitHub Release exists. A `release: published`
# trigger would not fire at all, because GitHub suppresses follow-up events for releases
# created with GITHUB_TOKEN — the same reason the consumer proof and the docs rebuild are
# dispatched by hand.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published release the starter is generated from, for example v1.2.3.
        required: true
        type: string
      source-commit:
        description: Immutable commit that release was built from.
        required: true
        type: string
      dry-run:
        description: Validate and report what would be published without pushing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a half-published starter: the job pushes a branch and then an immutable tag,
# and an interrupted run between the two leaves evidence that names no revision. Same reason
# release.yml sets it.
concurrency:
  group: starter-${{ inputs.release-tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.release-tag }}
  SOURCE_COMMIT: ${{ inputs.source-commit }}
  SOURCE_REPO: ${{ github.repository }}
  STARTER_REPO: Archont561/pixi-sandbox-starter
  ASSET: pixi-sandbox-x86_64-unknown-linux-musl

jobs:
  starter:
    name: publish starter ${{ inputs.release-tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pixi-sandbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
          cache: false

      # Fails closed on a draft, a tag that names a different commit than the one handed off,
      # or a release missing its standalone asset or SHA256SUMS (TASK-74 AC#4). Nothing has
      # touched the starter at this point, so a failure here leaves the previous revision
      # untouched by construction.
      - name: Verify the handed-off release
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run -e package xtask starter-verify-release --repo "$SOURCE_REPO" --tag "$TAG" --commit "$SOURCE_COMMIT"

      - name: Download the released binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$ASSET" --output "$RUNNER_TEMP/pixi-sandbox" --clobber

      - name: Download the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$SOURCE_REPO" --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS" --clobber

      # `gh release download` is HTTPS and authenticated, but the starter's whole claim is that
      # a specific verified binary generated it, so the checksum is checked rather than assumed.
      - name: Verify the binary against SHA256SUMS
        run: pixi run -e package xtask starter-verify-asset --binary "$RUNNER_TEMP/pixi-sandbox" --sums "$RUNNER_TEMP/SHA256SUMS" --asset "$ASSET"

      - name: Make the released binary executable
        run: chmod +x "$RUNNER_TEMP/pixi-sandbox"

      # The starter is a separately owned consumer repository. Bootstrap it before checkout so
      # the first release can create it (or seed an existing empty repository); checkout cannot
      # operate on a repository with zero commits. The PAT is deliberately used only here and
      # for publication because GITHUB_TOKEN cannot create or write the cross-repository target.
      - name: Bootstrap the starter repository
        env:
          GH_TOKEN: ${{ secrets.PIXI_SANDBOX_STARTER_TOKEN || github.token }}
        run: 'if ! gh api "repos/$STARTER_REPO" >/dev/null 2>&1; then gh api --method POST "orgs/${STARTER_REPO%%/*}/repos" -f name="${STARTER_REPO##*/}" -F private=false -F auto_init=true; elif [ -z "$(gh api "repos/$STARTER_REPO" --jq ''.default_branch // empty'')" ]; then content=$(printf ''# pixi-sandbox-starter\n'' | base64 -w0); gh api --method PUT "repos/$STARTER_REPO/contents/README.md" -f message=''Initial commit'' -f content="$content" -f branch=main; fi'

      # Checked out with a credential that carries `workflows: write`: the starter's owned
      # files include `.github/workflows/*`, which GITHUB_TOKEN may never push — the same
      # restriction that produced issue #101 in the consumer upgrade lane.
      - name: Check out the starter repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Archont561/pixi-sandbox-starter
          path: starter
          token: ${{ secrets.PIXI_SANDBOX_STARTER_TOKEN || github.token }}
          fetch-depth: 0

      - name: Scaffold the starter's own files
        run: pixi run -e package xtask starter-scaffold --out starter --tag "$TAG" --source-commit "$SOURCE_COMMIT" --source-repo "$SOURCE_REPO" --starter-repo "$STARTER_REPO"

      - name: Generate the owned files with the released binary
        run: '"$RUNNER_TEMP/pixi-sandbox" init --project-root starter --force'

      - name: Lock the starter environment
        run: pixi lock --manifest-path starter/pixi.toml

      # Second generation must change nothing: that is the publication contract's idempotence
      # promise, and `init --check` is the same gate consumers run against their own tree.
      - name: Prove regeneration is byte-identical
        run: '"$RUNNER_TEMP/pixi-sandbox" init --project-root starter --check'

      - name: Lint the generated workflows
        run: pixi run -e default lint-actions starter/.github/workflows/publish-sandbox.yml starter/.github/workflows/relock.yml

      # A fresh clone must install from the lockfile and run the documented command, or the
      # template's three-step promise is false (TASK-74 AC#2 and AC#9).
      - name: Prove a fresh clone runs the documented dev task
        run: pixi run --manifest-path starter/pixi.toml dev

      - name: Verify the assembled starter
        run: pixi run -e package xtask starter-verify --dir starter --tag "$TAG"

      - name: Publish the starter revision
        env:
          GH_TOKEN: ${{ secrets.PIXI_SANDBOX_STARTER_TOKEN || github.token }}
        run: pixi run -e package xtask starter-publish --dir starter --remote "$GITHUB_SERVER_URL/$STARTER_REPO" --starter-repo "$STARTER_REPO" --tag "$TAG" --source-commit "$SOURCE_COMMIT" ${{ inputs.dry-run && '--dry-run' || '' }}

      # Evidence for a failed run matters more than for a successful one: the summary names the
      # phase that failed and the tag it failed for, without exposing a token.
      - name: Upload starter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-${{ inputs.release-tag }}
          path: |
            starter/pixi.toml
            starter/pixi.lock
            starter/pixi-sandbox.toml
            starter/README.md
            starter/.gitignore
            starter/.github/workflows/
          if-no-files-found: warn
          retention-days: 30
