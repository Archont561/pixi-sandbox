name: docs

# Build the Astro + Starlight site and publish it to GitHub Pages.
# One line per step: `pixi run -e docs docs-build` builds the site (install + build).

on:
  push:
    branches: [main]
    paths: ["docs/**", "crates/**", ".knowledge/**", "pixi.toml", "pixi.lock"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: docs
          cache: true
      - run: pixi run -e docs docs-build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # Pages limits that matter here: 1 GB published site, ~100 GB/month bandwidth,
        # 10-minute build timeout. Never publish the sandbox payload from this site;
        # large channels belong on a package channel, not Pages (.knowledge/design.md §6).
