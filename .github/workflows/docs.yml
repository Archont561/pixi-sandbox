name: docs

# Build the Astro + Starlight site and publish it to GitHub Pages.
# One line per step: `pixi run docs build` builds the site (install + build).

on:
  push:
    branches: [main]
    paths: ["docs/**", "crates/**", "backlog/**", "package.json", "bun.lock", "pixi.toml", "pixi.lock"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: default
          cache: true
      - run: pixi run docs build
      # The docs quality gates (task-110): each is a `pixi run` task under scripts/, so CI and
      # a laptop run the same gate. A dead internal link, an unquoted frontmatter colon, an
      # inaccessible page, or a documented flag the CLI does not accept fails here — before
      # the site is published.
      - run: pixi run docs-frontmatter-check
      - run: pixi run docs-link-check
      - run: pixi run docs-a11y-check
      - run: pixi run docs-snippet-check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # Pages limits that matter here: 1 GB published site, ~100 GB/month bandwidth,
        # 10-minute build timeout. Never publish the sandbox payload from this site;
        # large channels belong on a package channel, not Pages (backlog/docs/specifications/transport-and-restore/doc-2 - Transport-and-Restore-Specification.md §6).
