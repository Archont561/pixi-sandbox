name: docs

# Build the Astro + Starlight site and publish it to GitHub Pages.
# One line per step: `pixi run -e docs docs-build` builds the site (install + build).

on:
  push:
    branches: [main]
    paths: ["docs/**", "crates/**", ".knowledge/**", "pixi.toml", "pixi.lock"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          environments: docs
          cache: true
      - run: pixi run -e docs docs-build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        # Pages limits that matter here: 1 GB published site, ~100 GB/month bandwidth,
        # 10-minute build timeout. Never publish the sandbox payload from this site;
        # large channels belong on a package channel, not Pages (.knowledge/design.md §6).
