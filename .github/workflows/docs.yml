name: docs

# Build the Astro + Starlight site and publish it to GitHub Pages.
# One line per step: `pixi run -e docs docs-build` builds the site (install + build).

on:
  push:
    branches: [main]
    paths: ["docs/**", "crates/**", ".knowledge/**", "pixi.toml", "pixi.lock"]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: docs
          cache: true
      - run: pixi run -e docs docs-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        # Pages limits that matter here: 1 GB published site, ~100 GB/month bandwidth,
        # 10-minute build timeout. Never publish the sandbox payload from this site;
        # large channels belong on a package channel, not Pages (.knowledge/design.md §6).
