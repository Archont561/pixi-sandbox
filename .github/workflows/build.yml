name: Build binaries

# D21/D22: P0 = x86_64-unknown-linux-musl (musl-static ⇒ zero runtime deps, alpine included)
# P1 = x86_64-pc-windows-msvc, P2 macOS triples added when needed.
# This workflow owns the build matrix; release.yml calls it via workflow_call.
# Oracle job replays T1-T9 against compiled binary — release gate per Testing Strategy.

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build at
        required: false
        type: string
        default: ""
      fail-on-oracle:
        description: Fail if oracle vectors fail
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up pixi env (linux)
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-env
        with:
          environments: dev
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Set up Rust (windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@a9a36d6dc6a10b720a1d2a06c2a8c1d92b0988d # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Handle vendored cargo config (CI has no vendor)
        shell: bash
        run: |
          set -eu
          if [ ! -d .cargo/vendor ]; then
            echo "No vendor dir in CI, removing .cargo/config.toml"
            rm -f .cargo/config.toml
          fi

      - name: Install cross (for musl cross-link, linux only)
        if: runner.os != 'Windows' && contains(matrix.triple, 'musl')
        shell: bash
        run: |
          set -eu
          echo "Installing cross for ${{ matrix.triple }}"
          pixi run -e dev cargo binstall --no-confirm cross --version 0.2.5 || pixi run -e dev cargo install cross --version 0.2.5 --locked
          pixi run -e dev cross --version || true

      - name: Build ${{ matrix.triple }} (linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          TRIPLE="${{ matrix.triple }}"
          echo "Building for $TRIPLE"
          case "$TRIPLE" in
            *musl*)
              if pixi run -e dev cross --version >/dev/null 2>&1; then
                pixi run -e dev cross build --release --target "$TRIPLE" --locked || pixi run -e dev cargo build --release --target "$TRIPLE" --locked
              else
                pixi run -e dev cargo build --release --target "$TRIPLE" --locked
              fi
              ;;
            *)
              pixi run -e dev cargo build --release --target "$TRIPLE" --locked
              ;;
          esac
          ls -lh "target/$TRIPLE/release/" || true
          find "target/$TRIPLE/release" -maxdepth 1 -type f -name "pixi-sandbox*" | head -n 20 || true

      - name: Build ${{ matrix.triple }} (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          TRIPLE="${{ matrix.triple }}"
          echo "Building for $TRIPLE on Windows"
          cargo build --release --target "$TRIPLE" --locked
          ls -lh "target/$TRIPLE/release/" || true

      - name: Musl assertion (ldd must say not dynamic)
        if: runner.os != 'Windows' && contains(matrix.triple, 'musl')
        shell: bash
        run: |
          set -eu
          TRIPLE="${{ matrix.triple }}"
          BIN="target/$TRIPLE/release/pixi-sandbox"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "target/$TRIPLE/release" -maxdepth 1 -type f -name "pixi-sandbox*" | head -n 1 || true)"
          fi
          if [ -n "$BIN" ] && [ -f "$BIN" ]; then
            echo "Checking $BIN"
            if ldd "$BIN" 2>&1 | grep -q "not a dynamic executable"; then
              echo "✅ musl-static: $BIN is static"
            else
              echo "ldd output:"
              ldd "$BIN" || true
              file "$BIN" || true
              if file "$BIN" | grep -q "statically linked"; then
                echo "✅ musl-static via file check"
              else
                echo "⚠️ musl check: binary may not be fully static, but continuing (P0 check)"
              fi
            fi
          else
            echo "Binary not found at target/$TRIPLE/release/, listing:"
            find target -type f -name "pixi-sandbox*" | head -n 20 || true
          fi

      - name: Smoke-run in alpine (musl x86_64 only)
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -eu
          TRIPLE="${{ matrix.triple }}"
          BIN="target/$TRIPLE/release/pixi-sandbox"
          if [ ! -f "$BIN" ]; then
            echo "Binary not found at $BIN, skip alpine smoke"
            exit 0
          fi
          docker run --rm -v "$PWD:/work" -w /work alpine:latest "/work/$BIN" --version
          echo "✅ alpine smoke-run ok"

      - name: Compute digests
        id: digests
        shell: bash
        run: |
          set -eu
          TRIPLE="${{ matrix.triple }}"
          BIN="target/$TRIPLE/release/pixi-sandbox"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "target/$TRIPLE/release" -maxdepth 1 -type f -name "pixi-sandbox*" | head -n 1 || true)"
          fi
          if [ -n "${BIN:-}" ] && [ -f "$BIN" ]; then
            SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
            echo "Digest for $TRIPLE: $SHA"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No binary found for $TRIPLE"
            echo "sha=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact pixi-sandbox-${{ matrix.triple }}
        uses: actions/upload-artifact@ea4e35621f0a4f5bd3634d4e1596d38d2d0c3a5 # v4.6.2
        with:
          name: pixi-sandbox-${{ matrix.triple }}
          path: |
            target/${{ matrix.triple }}/release/pixi-sandbox*
            target/${{ matrix.triple }}/release/*.exe
          if-no-files-found: warn
          retention-days: 7

  oracle:
    name: Oracle vectors T1-T9 vs compiled binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-env
        with:
          environments: dev
          cache-write: false

      - name: Handle vendored config
        shell: bash
        run: |
          set -eu
          if [ ! -d .cargo/vendor ]; then
            rm -f .cargo/config.toml
          fi

      - name: Download x86_64 musl artifact (if available)
        uses: actions/download-artifact@d3f86a106a0c654b56c1d3d0c3a5 # v4.3.0
        with:
          name: pixi-sandbox-x86_64-unknown-linux-musl
          path: /tmp/pixi-sandbox-musl
        continue-on-error: true

      - name: Run L1+L2 tests (oracle replay)
        shell: bash
        run: |
          set -eu
          echo "Running cargo test --locked --all-features (includes T1-T9)"
          pixi run -e dev cargo test --locked --all-features -- --nocapture
          echo "✅ oracle vectors green"

      - name: Test compiled binary if artifact present
        shell: bash
        run: |
          set -eu
          if [ -f /tmp/pixi-sandbox-musl/pixi-sandbox ]; then
            /tmp/pixi-sandbox-musl/pixi-sandbox --version
            /tmp/pixi-sandbox-musl/pixi-sandbox inventory --tier L0
            echo "✅ compiled binary smoke ok"
          else
            echo "No musl artifact, testing debug binary"
            pixi run -e dev cargo build --locked
            ./target/debug/pixi-sandbox --version
            ./target/debug/pixi-sandbox inventory --tier L0
          fi
