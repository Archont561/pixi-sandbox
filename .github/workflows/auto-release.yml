name: auto-release

# Cut a release on demand. This workflow prepares the release commit — bump the version,
# refresh Cargo.lock, regenerate CHANGELOG.md — tags it, and hands the tag to `release.yml`,
# which builds the five static tier-1 binaries, publishes the Conda package to prefix.dev, and publishes the GitHub Release.
#
# It is deliberately split from `release.yml` (which stays the pure build-and-publish half) so
# the version-bump policy lives in one reviewable place. Both halves are tested xtask
# commands: `pixi run xtask prepare-release` stamps the tree and records what it touched
# (`.release-touched`), and `pixi run xtask commit-release <tag>` turns that prepared tree
# into the release commit, the annotated tag, and the two pushes — its guards (stage exactly
# the reported files, refuse unaccounted modifications, refuse an existing remote tag) are
# tempdir-fixture tested against a real git and a bare remote, so the exact routine CI
# performs is the one a maintainer can run and review locally.
#
# Trigger it remotely — no local checkout required:
#   gh workflow run auto-release.yml                       # auto bump from conventional commits
#   gh workflow run auto-release.yml -f bump=minor
#   gh workflow run auto-release.yml -f version=v1.2.3     # explicit version
#   gh workflow run auto-release.yml -f dry-run=true       # show the diff, change nothing
# …or the Actions tab "Run workflow" button, or the REST dispatch API. `workflow_call` lets
# another pipeline cut a release as a step.
#
# How the build half starts: the two pushes below do it themselves. `release.yml` triggers on
# `push: tags: v*.*.*` and `publish-sandbox.yml` on `push: branches: [main]`, so the release
# commit and its tag start both without a hand-off.
#
# This workflow used to dispatch them explicitly, because GitHub suppresses workflow triggering
# for events made with GITHUB_TOKEN. That suppression is a property of GITHUB_TOKEN alone, and
# this job cannot run on GITHUB_TOKEN at all: the release commit restamps the committed relock
# render, and GITHUB_TOKEN may not push `.github/workflows/**`. RELEASE_PUSH_TOKEN is therefore
# required for a real cut, and a PAT or GitHub App token triggers pushes normally — which made
# the explicit dispatches a *second* trigger rather than the only one. Keeping both would have
# run the release build twice on one tag and repacked the transport twice, concurrently, and
# the repack force-pushes the transport branch.
#
# So: do not re-add a dispatch step here without first removing the matching `on: push` trigger.
# For a manual re-run after a failure, `pixi run dispatch-release <tag>` and
# `pixi run dispatch-sandbox-repack` still exist.
#
# To fully automate on every merge to main instead, add a `push: branches: [main]` trigger here
# and gate the release step on convco reporting a bump.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level when no explicit version is supplied
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: Explicit version to cut (e.g., v1.2.3); overrides `bump` when set
        type: string
        default: ""
      dry-run:
        description: Prepare and print the diff but do not commit, tag, or release
        type: boolean
        default: false
  workflow_call:
    inputs:
      bump:
        description: Bump level when no explicit version is supplied
        required: false
        type: string
        default: auto
      version:
        description: Explicit version to cut (e.g., v1.2.3); overrides `bump` when set
        required: false
        type: string
        default: ""
      dry-run:
        description: Prepare and print the diff but do not commit, tag, or release
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_PUSH_TOKEN:
        description: >-
          Token used to push the release commit and tag. Required for a real cut: the release
          commit restamps the committed relock render, so it touches .github/workflows/**,
          which GITHUB_TOKEN may never push. Supply a PAT with the `workflow` scope, a
          fine-grained token with `Contents: write` + `Workflows: write`, or a GitHub App
          token with the Workflows permission. Its pushes also start release.yml and
          publish-sandbox.yml, which this workflow relies on instead of dispatching them.
          Falls back to GITHUB_TOKEN, which is enough for dry-run only.
        required: false

# Push the release commit and its tag. That is the whole job now, so `contents` is the whole
# block: the two `gh workflow run` steps that needed `actions: write` are gone, because both
# pushes trigger their consumers themselves. Re-adding a dispatch step means re-adding that
# scope — and reading the header first, because a second trigger is the bug this removed.
#
# There is deliberately no `workflows` scope. `permissions:` only tunes GITHUB_TOKEN, and
# GITHUB_TOKEN is barred by GitHub from writing anything under `.github/workflows/` whatever
# this block says; `workflows` is not even a scope GitHub accepts, so adding it does not fail
# the push — it makes the whole file unparseable and every run dies in 0s with no jobs (run
# 37501052919). Check 11 in `xtask check-repository` now fails that edit before it lands.
#
# This bites because `prepare-release` restamps the committed relock render, so the release
# commit always touches `.github/workflows/relock.yml`. Pushing it needs a token that itself
# carries the right: set RELEASE_PUSH_TOKEN to a PAT with the `workflow` scope (classic) or
# `Workflows: read and write` (fine-grained), or a GitHub App token with the Workflows
# permission. The checkout step below already hands that secret to git (`persist-credentials`),
# so the secret is the only missing piece — without it the push is rejected with
# "refusing to allow a GitHub App to create or update workflow ... without `workflows` permission".
# A dry run needs none of this: it never pushes, so it works on the github.token fallback.
permissions:
  contents: write

# One release at a time; never cancel a release midway.
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut:
    name: cut release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (full history for convco)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # convco derives the next version from the whole commit history, so a shallow
          # checkout would miscount the bump. commit-release pushes with these credentials.
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Install Pixi (default env → convco, cargo)
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: default
          cache: true

      # prepare-release prints the resolved vX.Y.Z as its last stdout line and, when GitHub
      # sets GITHUB_OUTPUT, writes it as the `version` output with the diff stat as the step
      # summary — the same command reports the same things locally.
      - name: Prepare release (bump + changelog + lock)
        id: prep
        run: pixi run xtask prepare-release ${{ inputs.version != '' && inputs.version || inputs.bump }}

      # Compile against the prepared version and run every consistency oracle *before* anything
      # is committed. ci.yml does run on the release commit now (the push carries a PAT or App
      # token, so `on: push` fires), but only afterwards — this is what keeps a release that
      # fails its own oracles from reaching main and being tagged in the first place.
      - name: Validate prepared repository
        run: pixi run xtask check-repository

      # commit-release checks the remote tag first, then prints the prepared diff and stops:
      # no staging, no commit, no tag, no push.
      - name: Dry-run — show diff and stop
        if: ${{ inputs.dry-run }}
        run: pixi run xtask commit-release -- ${{ steps.prep.outputs.version }} --dry-run

      # Stages exactly what .release-touched lists, refuses any unaccounted modification,
      # commits as pixi-sandbox[bot], tags, and pushes main + the tag. The release commit's
      # author is the bot identity ShellGit carries, so it never depends on the runner's git
      # config.
      #
      # This is the last step. Both pushes trigger their own consumers: the tag starts
      # release.yml, and main starts publish-sandbox.yml, which repacks the transport so the
      # published branch names the release commit rather than the last pre-release push
      # (what v0.4.2 exposed: the transport stood at dbe57a8/0.4.1 while main and the release
      # were at 7745e9c/0.4.2). That only holds while RELEASE_PUSH_TOKEN is a PAT or App
      # token; see the header before adding any dispatch step back.
      - name: Commit, tag, and push
        if: ${{ ! inputs.dry-run }}
        run: pixi run xtask commit-release ${{ steps.prep.outputs.version }}
