name: auto-release

# Cut a release on demand. This workflow prepares the release commit — bump the version,
# refresh Cargo.lock, regenerate CHANGELOG.md — tags it, and hands the tag to `release.yml`,
# which builds the five static tier-1 binaries, publishes the Conda package to prefix.dev, and publishes the GitHub Release.
#
# It is deliberately split from `release.yml` (which stays the pure build-and-publish half) so
# the version-bump policy lives in one reviewable place. Both halves are tested xtask
# commands: `pixi run xtask prepare-release` stamps the tree and records what it touched
# (`.release-touched`), and `pixi run xtask commit-release <tag>` turns that prepared tree
# into the release commit, the annotated tag, and the two pushes — its guards (stage exactly
# the reported files, refuse unaccounted modifications, refuse an existing remote tag) are
# tempdir-fixture tested against a real git and a bare remote, so the exact routine CI
# performs is the one a maintainer can run and review locally.
#
# Trigger it remotely — no local checkout required:
#   gh workflow run auto-release.yml                       # auto bump from conventional commits
#   gh workflow run auto-release.yml -f bump=minor
#   gh workflow run auto-release.yml -f version=v1.2.3     # explicit version
#   gh workflow run auto-release.yml -f dry-run=true       # show the diff, change nothing
# …or the Actions tab "Run workflow" button, or the REST dispatch API. `workflow_call` lets
# another pipeline cut a release as a step.
#
# Why a separate dispatch to release.yml instead of an automatic tag trigger: a tag pushed with
# GITHUB_TOKEN does not start another workflow (GitHub suppresses that recursion), so we call
# release.yml explicitly on the new tag. To fully automate on every merge to main instead, add a
# `push: branches: [main]` trigger here and gate the release step on convco reporting a bump.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level when no explicit version is supplied
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: Explicit version to cut (e.g., v1.2.3); overrides `bump` when set
        type: string
        default: ""
      dry-run:
        description: Prepare and print the diff but do not commit, tag, or release
        type: boolean
        default: false
  workflow_call:
    inputs:
      bump:
        description: Bump level when no explicit version is supplied
        required: false
        type: string
        default: auto
      version:
        description: Explicit version to cut (e.g., v1.2.3); overrides `bump` when set
        required: false
        type: string
        default: ""
      dry-run:
        description: Prepare and print the diff but do not commit, tag, or release
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_PUSH_TOKEN:
        description: >-
          Token used to push the release commit/tag and dispatch release.yml. Defaults to
          GITHUB_TOKEN; supply a PAT or GitHub App token when branch protection or required
          reviews block the built-in token from pushing to main.
        required: false

# Push the release commit + tag (contents) and dispatch release.yml (actions).
permissions:
  contents: write
  actions: write
  workflows: write

# One release at a time; never cancel a release midway.
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut:
    name: cut release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (full history for convco)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # convco derives the next version from the whole commit history, so a shallow
          # checkout would miscount the bump. commit-release pushes with these credentials.
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Install Pixi (default env → convco, cargo)
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: default
          cache: true

      # prepare-release prints the resolved vX.Y.Z as its last stdout line and, when GitHub
      # sets GITHUB_OUTPUT, writes it as the `version` output with the diff stat as the step
      # summary — the same command reports the same things locally.
      - name: Prepare release (bump + changelog + lock)
        id: prep
        run: pixi run xtask prepare-release ${{ inputs.version != '' && inputs.version || inputs.bump }}

      # Compile against the prepared version and run every consistency oracle before anything
      # can be committed. This is the release-commit counterpart to CI, whose push trigger is
      # suppressed when commit-release uses GITHUB_TOKEN.
      - name: Validate prepared repository
        run: pixi run xtask check-repository

      # commit-release checks the remote tag first, then prints the prepared diff and stops:
      # no staging, no commit, no tag, no push.
      - name: Dry-run — show diff and stop
        if: ${{ inputs.dry-run }}
        run: pixi run xtask commit-release -- ${{ steps.prep.outputs.version }} --dry-run

      # Stages exactly what .release-touched lists, refuses any unaccounted modification,
      # commits as pixi-sandbox[bot], tags, and pushes main + the tag. The release commit's
      # author is the bot identity ShellGit carries, so it never depends on the runner's git
      # config.
      - name: Commit, tag, and push
        if: ${{ ! inputs.dry-run }}
        run: pixi run xtask commit-release ${{ steps.prep.outputs.version }}

      - name: Dispatch release build for the new tag
        if: ${{ ! inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: pixi run dispatch-release ${{ steps.prep.outputs.version }}

      # The release commit's push was the last GITHUB_TOKEN event of this run, so nothing
      # `on: push` fires for it — including publish-sandbox.yml, which repacks the transport
      # on every push to main. Without this hand-off the published branch keeps naming the
      # pre-release commit until the next human push (exactly what v0.4.2 exposed: the
      # transport stood at dbe57a8/0.4.1 while main and the release were at 7745e9c/0.4.2).
      - name: Dispatch sandbox transport repack
        if: ${{ ! inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: pixi run dispatch-sandbox-repack
