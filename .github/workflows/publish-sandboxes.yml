name: publish-sandboxes

# Release-binary, native-platform publisher. A caller's reviewed `.pixi-sandbox.toml` becomes a
# matrix before any packing starts; each job runs on the native runner named by that plan and
# force-pushes one platform/bundle branch. The companion setup action verifies the downloaded
# pixi-sandbox release before it ever executes.

on:
  workflow_call:
    inputs:
      config:
        description: Project-relative sandbox bundle declaration.
        required: false
        type: string
        default: .pixi-sandbox.toml
      release-repository:
        description: Repository that publishes pixi-sandbox binary release assets.
        required: true
        type: string
      release-ref:
        description: Immutable source commit SHA used to obtain the two composite actions.
        required: true
        type: string
      release-version:
        description: Immutable release tag downloaded by setup-pixi-sandbox; use `latest` only deliberately.
        required: true
        type: string
      checksums-asset:
        description: Release asset with standard SHA-256 checksum lines.
        required: false
        type: string
        default: SHA256SUMS
    secrets:
      SANDBOX_PUSH_TOKEN:
        description: Token allowed to force-push sandbox branches; defaults to the caller GITHUB_TOKEN.
        required: false
      SANDBOX_RELEASE_TOKEN:
        description: Optional token for a private pixi-sandbox release repository.
        required: false

permissions:
  contents: write

jobs:
  plan:
    name: validate sandbox publish plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          persist-credentials: false
      # A reusable workflow runs in the caller repository. Reject moving refs before checking
      # out its own source, so sibling composite actions cannot be shadowed or silently changed.
      - name: Require immutable pixi-sandbox action source
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
        run: '[[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::release-ref must be a 40-character commit SHA"; exit 1; }'
      - name: Checkout pixi-sandbox actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.release-repository }}
          ref: ${{ inputs.release-ref }}
          path: pixi-sandbox-action
          persist-credentials: false
          token: ${{ secrets.SANDBOX_RELEASE_TOKEN || github.token }}
      - name: Install verified pixi-sandbox release
        id: sandbox
        uses: ./pixi-sandbox-action/.github/actions/setup-pixi-sandbox
        with:
          repository: ${{ inputs.release-repository }}
          version: ${{ inputs.release-version }}
          checksums-asset: ${{ inputs.checksums-asset }}
          token: ${{ secrets.SANDBOX_RELEASE_TOKEN || github.token }}
      - name: Emit reviewed native matrix
        id: plan
        working-directory: project
        shell: bash
        env:
          CONFIG: ${{ inputs.config }}
          SANDBOX_BIN: ${{ steps.sandbox.outputs.path }}
        run: echo "matrix=$("$SANDBOX_BIN" plan --config "$CONFIG" --json)" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.bundle }} · ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    concurrency:
      group: sandbox-publish-${{ github.repository }}-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          persist-credentials: false
      - name: Require immutable pixi-sandbox action source
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
        run: '[[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::release-ref must be a 40-character commit SHA"; exit 1; }'
      - name: Checkout pixi-sandbox actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.release-repository }}
          ref: ${{ inputs.release-ref }}
          path: pixi-sandbox-action
          persist-credentials: false
          token: ${{ secrets.SANDBOX_RELEASE_TOKEN || github.token }}
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          cache: true
      - name: Install verified pixi-sandbox release
        id: sandbox
        uses: ./pixi-sandbox-action/.github/actions/setup-pixi-sandbox
        with:
          repository: ${{ inputs.release-repository }}
          version: ${{ inputs.release-version }}
          checksums-asset: ${{ inputs.checksums-asset }}
          token: ${{ secrets.SANDBOX_RELEASE_TOKEN || github.token }}
      - name: Pack, verify, and publish one native sandbox branch
        id: publish
        uses: ./pixi-sandbox-action/.github/actions/publish-pixi-sandbox
        with:
          project: project
          environments: ${{ matrix.environments }}
          platform: ${{ matrix.platform }}
          branch: ${{ matrix.branch }}
          cargo-vendor: ${{ matrix.cargo_vendor }}
          self-bin: ${{ steps.sandbox.outputs.path }}
          remote: ${{ github.server_url }}/${{ github.repository }}.git
          output-dir: ${{ runner.temp }}/pixi-sandbox/${{ matrix.bundle }}-${{ matrix.platform }}
          push-token: ${{ secrets.SANDBOX_PUSH_TOKEN || github.token }}
      - name: Upload published manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-manifest-${{ matrix.bundle }}-${{ matrix.platform }}
          path: ${{ steps.publish.outputs.manifest }}
          retention-days: 14
