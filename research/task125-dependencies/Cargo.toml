# Temporary, isolated source provisioning for TASK-125. Not a product dependency graph.
[workspace]

[package]
name = "task125-dependencies"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Local-only installation: TLS/download features intentionally disabled. The connected
# pack adapter will reuse the product's ureq client; no solver or remote install is used.
rattler = { version = "=0.48.7", default-features = false }
rattler_conda_types = { version = "=0.52.1", default-features = false }
rattler_lock = "=0.32.6"
rattler_package_streaming = { version = "=0.27.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
url = "2"
# The same wheel-install implementation used by pixi-pack 0.7.11, without uv's
# HTTP client, resolver, build frontend or distribution preparer. Requires Rust 1.94.
uv-install-wheel = "=0.0.57"
uv-distribution-filename = "=0.0.57"
uv-pypi-types = "=0.0.57"
uv-preview = "=0.0.57"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
