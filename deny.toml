# cargo-deny configuration (run by `pixi run deny`, i.e. in CI).
# Checked with cargo-deny 0.20.x.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Owner-approved, advisory-specific exception (2026-10-22, PR #186). basic-toml has no
# fixed release. It is used only by i18n-config in rstest-bdd's dev/test chain, not
# the shipped CLI. Revisit when i18n-config replaces it; vulnerability advisories
# remain enforced. TLS/ZIP vulnerability advisories are never excepted.
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "Test-only rstest-bdd -> i18n-embed -> i18n-config -> basic-toml; unmaintained, no fixed release; owner accepted this specific risk in PR #186 on 2026-10-22" },
  # Owner explicitly accepted this additional runtime risk for TASK-125 / PR #187.
  # rattler_conda_types/lock require deprecated serde_yaml -> unsafe-libyaml.
  # No fixed release exists; revisit when rattler moves to a maintained YAML parser.
  { id = "RUSTSEC-2024-0449", reason = "TASK-125 owner-approved runtime unmaintained-only exception (2026-10-22, PR #187): rattler YAML chain; no fixed release; all vulnerability advisories remain enforced" },
]

[licenses]
version = 2
# Permissive only. If a dependency needs an exception, add it here *with a reason*
# rather than loosening the list — this crate ships into places that have to pass a
# license review (see backlog/docs/adr/README.md ADR-8).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # `ureq` embeds webpki-roots for verified HTTPS release downloads. This is the
  # permissive data licence for Mozilla's trust-store distribution, not product code.
  "CDLA-Permissive-2.0",
]
# Owner-approved for TASK-125 (2026-10-22, PR #187), confined to the exact
# bzip2 implementation/version rattler uses for legacy Conda archive extraction.
# This does not add the license to the global allowlist.
exceptions = [
  { name = "libbz2-rs-sys", version = "=0.2.5", allow = ["bzip2-1.0.6"] },
  # Owner-approved TASK-125 UV metadata-parser dependencies (2026-10-22).
  # Confined to these versions; 0BSD is not globally allowed.
  { name = "mailparse", version = "=0.16.1", allow = ["0BSD"] },
  { name = "quoted_printable", version = "=0.5.2", allow = ["0BSD"] },
]
confidence-threshold = 0.9
# The list is deliberately broader than today's dependency tree: a new dependency that
# happens to be MPL-2.0 should not require editing CI config to get through review.
# (`cargo deny check` otherwise warns "license was not encountered" for each unused entry.)
unused-allowed-license = "allow"

[bans]
# `syn 2` arrives via tracing-attributes while `syn 3` arrives via clap/serde/thiserror.
# Duplication in a CLI is annoying, not a bug — warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# `pixi-sandbox` is a CLI; duplicating a transitive version is annoying but not a bug.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Vendored trees (`.pixi-sandbox/vendor/`) are not a network source; they are declared
# as a directory replacement in `.cargo/config.toml` and are not seen by cargo-deny.
allow-git = []
