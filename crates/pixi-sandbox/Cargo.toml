[package]
name = "pixi-sandbox"
description = "Pack pixi environments and restore them on an air-gapped machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pixi-sandbox"
path = "src/main.rs"

[features]
# CI-only integration tests that run against real airlock transports.
ci = []

[dependencies]
# `version` next to `path`: cargo-deny rejects a bare path dependency as a wildcard, and the
# published `.conda` should state which core it was built against.
pixi-sandbox-core = { path = "../pixi-sandbox-core", version = "0.6.1" }
# git goes through a trait (crates/pixi-sandbox-git): the real binary uses `ShellGit`, tests
# use `FakeGit`, and neither the CLI nor the tests ever touch the developer's own repository.
pixi-sandbox-git = { path = "../pixi-sandbox-git", version = "0.6.1" }
anyhow = { workspace = true }
clap = { workspace = true }
# Reads Cargo.lock to reject a lockfile cargo itself cannot vendor (design.md §11).
toml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fs2 = { workspace = true }
tar = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# Integration tests link against the crate's dependencies only if they are repeated here, and
# `tests/fixtures.rs` deliberately verifies the fixture with the real core (not a copy of the
# logic it is supposed to exercise).
pixi-sandbox-core = { path = "../pixi-sandbox-core", version = "0.6.1" }
pixi-sandbox-git = { path = "../pixi-sandbox-git", version = "0.6.1" }
assert_cmd = { workspace = true }
predicates = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
tempfile = { workspace = true }
# Parses the `.feature` files for the BDD layer's binding oracle (`tests/support/bdd.rs`), which
# is the only runtime parse left now that `#[scenario]` does its own at compile time. Same
# version and feature set rstest-bdd itself declares, so the edge adds no package to the locked
# graph.
gherkin = { version = "0.16.0", default-features = false, features = [
  "parser",
] }

# Inherit the workspace lint policy (decision D20): the gate is pedantic, workspace-wide.
[lints]
workspace = true
