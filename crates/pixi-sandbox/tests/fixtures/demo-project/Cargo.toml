# Its own workspace root on purpose: the fixture is a *subject* of the tests, never a member
# of this repository's cargo workspace (that is what the compiler would otherwise demand).
[workspace]

[package]
name = "demo-project"
version = "0.1.0"
edition = "2021"
description = "Tiny crate used to exercise the cargo-vendor path of a sandbox transport"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
