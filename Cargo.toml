[workspace]
resolver = "2"
members = [
  "crates/pixi-sandbox-core",
  "crates/pixi-sandbox-git",
  "crates/pixi-sandbox",
  "crates/xtask",
]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Archont561/pixi-sandbox"
authors = ["Archont561"]

[workspace.dependencies]
# library + CLI
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Mutable TOML documents retain comments and layout while init adds the canonical channel.
toml_edit = "0.25"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# files, hashes, shards
sha2 = "0.11"
walkdir = "2"
fs2 = "0.4"
tar = "0.4"
# Connected-side fetching: HTTPS release assets are verified against the embedded tool pins before use.
ureq = "3.4"
# dev
assert_cmd = "2"
predicates = "3"
proptest = "1"
rstest = "0.26.1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"
