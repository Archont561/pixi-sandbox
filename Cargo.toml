[workspace]
resolver = "3"
members = ["crates/sandbox-core", "crates/pixi-sandbox"]

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
clap_complete = "4"
clap-verbosity-flag = { version = "3", features = ["tracing"] }
flate2 = "1"
hex = "0.4"
insta = "1"
predicates = "3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }