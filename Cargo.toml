[workspace]
resolver = "2"
members = [
  "crates/pixi-sandbox-core",
  "crates/pixi-sandbox-git",
  "crates/pixi-sandbox",
  "crates/xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Archont561/pixi-sandbox"
authors = ["Archont561"]

# The lint gate is pedantic, inherited by every crate (decision ADR-20): the policy lives here
# once so no crate can drift, and the per-crate lint scripts' `-D warnings` makes the level
# binding. Nursery stays off (ADR-20). The one workspace-wide exception is deliberate and
# reasoned: every `literal_string_with_formatting_args` hit in this workspace is an
# intentional placeholder template (`.replace("{version}", …)`) or a shell parameter
# expansion asserted inside a Rust string literal (`${PREFIX:-sandbox}`) — "fixing" them
# would corrupt the very string being asserted (doc-12 Finding 6).
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
literal_string_with_formatting_args = "allow"

[workspace.dependencies]
# library + CLI
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# files, hashes, shards
sha2 = "0.11"
walkdir = "2"
fs2 = "0.4"
tar = "0.4"
# TASK-137 spike: gzip decoding of cached `.crate` tarballs for the local-registry mirror.
flate2 = "1"
# Connected-side fetching: HTTPS release assets are verified against the embedded tool pins before use.
ureq = "3.4"
# TASK-125 native, local-only package installation. TLS is provided only by the
# connected ureq adapter; do not enable rattler's rustls/native-tls defaults.
rattler = { version = "=0.54.2", default-features = false }
rattler_conda_types = { version = "=0.57.1", default-features = false }
rattler_package_streaming = { version = "=0.27.15", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
url = "2"
# Same low-level wheel writer as pixi-pack 0.7.11, without a network-capable
# resolver/preparer or Python subprocess. Its declared MSRV sets our 1.94 floor.
uv-install-wheel = "=0.0.57"
uv-distribution-filename = "=0.0.57"
uv-pypi-types = "=0.0.57"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
# The self-update transport (TASK-90 / doc-14, adopted as ADR-27): `self_update` supplies the
# release-lookup, download and checksum-parse path; our `ownership` refusal ladder, `replace` swap
# and the `mod.rs` orchestration stay hand-rolled. The feature set is the measured minimum: `ureq`
# reuses the HTTPS client this
# workspace already ships, `rustls` its TLS, `github` the release backend and `checksums` the
# SHA256SUMS path that mirrors the hand-rolled contract — so nothing here compiles reqwest, hyper,
# tokio or indicatif. One consequence the declaration does not remove: the lock resolves the
# crate's optional reqwest tree anyway (cargo locks optional dependencies no feature enables). The
# crate declares rustc 1.88, satisfied since TASK-92 (TASK-125 now needs 1.94 for wheels). That
# lift switched on clippy's MSRV-gated lints — the six `collapsible_if` sites in pixi-sandbox-core
# collapsed in the same change.
self_update = { version = "1.3", default-features = false, features = [
  "checksums",
  "github",
  "rustls",
  "ureq",
] }
# dev
assert_cmd = "2"
predicates = "3"
proptest = "1"
rstest = "0.27.0"
# BDD glue for the .feature layer (tests/features); MSRV 1.88, below the workspace toolchain.
rstest-bdd = "0.6.0"
# Step/scenario attribute macros for the same layer. They ship in a separate crate, so the
# airlocked vendor set gained the runtime half without them at first (CONTEXT.md, 2026-10-09
# second session); the relock bot refreshed Cargo.lock for #126 and the repacked transport now
# vendors the macros and their whole tree, so the layer binds through #[scenario] offline
# (task-87). strict-compile-time-validation implies compile-time-validation and pulls in no
# dependency of its own, which is why declaring it leaves the lockfile untouched. Together they
# make both registry faults compile errors — the house's fail-fast shape: a sentence two
# patterns match is ambiguous, a sentence no pattern matches is missing. The non-strict feature
# alone errors only on the ambiguous half and merely warns about the missing one, so it would
# let a typo'd sentence through to a runtime failure instead of a build failure.
rstest-bdd-macros = { version = "0.6.0", features = [
  "strict-compile-time-validation",
] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

# Debug artifacts for local builds. `target/` is the largest thing this repository produces on a
# developer's disk — 16 GiB on a cold build of this workspace (2026-10-24, 21 GiB volume) — and
# almost all of it is DWARF, not code: one linked xtask test binary measured 223 MiB, of which
# 205 MiB was `.debug_*` sections and 8 MiB was `.text`; a BDD test binary carried 65 MiB of DWARF
# against 16 MiB of code. Nothing here reduced that, because the only profile this file declared
# was `release`, and CI masked it with `CARGO_PROFILE_DEV_DEBUG=0` / `_TEST_DEBUG=0`.
#
# Dependency crates are the bulk of that DWARF and are never the code being debugged, so their
# debug info goes. The workspace's own crates keep theirs, which is what keeps `file:line` and
# locals in a failing test's backtrace. Declared for both profiles because `test` does not
# inherit a `dev` package override — the twin entries are load-bearing, not redundant.
#
# `incremental` is deliberately left at its default. Disabling it reclaims a further ~1 GiB of
# `target/debug/incremental` (measured) and costs the edit-compile loop it exists to serve;
# the DWARF above is the 90% win and this is not. Flip it here if disk, not latency, is scarce.
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0
