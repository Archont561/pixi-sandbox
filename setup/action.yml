name: Setup pixi-sandbox
description: Download, checksum-verify, and expose a standalone pixi-sandbox release binary. Use as Archont561/pixi-sandbox/setup@vX (or root Archont561/pixi-sandbox@vX).
author: pixi-sandbox
branding:
  icon: package
  color: orange

inputs:
  subpath:
    description: Which behaviour to run — `setup` or `publish`. Set by the `setup/` and `publish/` shims; you rarely pass this directly.
    required: false
    default: setup

  # --- setup ---
  repository:
    description: GitHub repository containing the pixi-sandbox release assets (OWNER/REPO).
    required: false
    default: Archont561/pixi-sandbox
  version:
    description: Immutable release tag to download. Set `latest` explicitly only for a deliberately non-reproducible workflow.
    required: false
    default: latest
  target:
    description: Rust target triple to download, or `auto` for the current hosted runner.
    required: false
    default: auto
  asset-template:
    description: Release asset template; supports {target}, {exe}, {tag}, and {version}.
    required: false
    default: pixi-sandbox-{target}{exe}
  checksums-asset:
    description: Release asset containing standard SHA-256 checksum lines. Ignored when sha256 is supplied.
    required: false
    default: SHA256SUMS
  sha256:
    description: Optional explicit SHA-256 for the selected binary asset; overrides checksums-asset lookup.
    required: false
    default: ""
  install-dir:
    description: Directory for the verified executable. Empty chooses a runner-temporary directory.
    required: false
    default: ""
  add-to-path:
    description: Add the executable directory to GITHUB_PATH.
    required: false
    default: "true"
  token:
    description: Optional GitHub token for release API access and private release downloads.
    required: false
    default: ""

  # --- publish (required in publish mode, validated at run time) ---
  project:
    description: Checked-out project root to sandbox. Required in publish mode.
    required: false
    default: ""
  environments:
    description: Comma-separated Pixi environments selected by the reviewed plan. Required in publish mode.
    required: false
    default: ""
  platform:
    description: Native Pixi platform being packed. Required in publish mode.
    required: false
    default: ""
  branch:
    description: Orphan branch to force-push. Required in publish mode.
    required: false
    default: ""
  cargo-vendor:
    description: Whether this bundle should vendor Cargo dependencies.
    required: false
    default: "true"
  self-bin:
    description: Verified standalone pixi-sandbox executable to embed in the branch. Required in publish mode.
    required: false
    default: ""
  remote:
    description: Credential-free Git remote URL to publish to. Required in publish mode.
    required: false
    default: ""
  output-dir:
    description: Fresh runner-temporary directory for the transport. Required in publish mode.
    required: false
    default: ""
  push-token:
    description: Optional token injected into Git configuration, never into the remote URL.
    required: false
    default: ""
  dry-run:
    description: When "true", pack and verify with `doctor` but skip the force-push. The orphan branch is left untouched; all other work runs so a branch can validate the publish path without mutating any branch.
    required: false
    default: "false"

outputs:
  path:
    description: Absolute path of the verified pixi-sandbox executable (setup mode).
    value: ${{ steps.setup-unix.outputs.path || steps.setup-windows.outputs.path }}
  version:
    description: Resolved immutable GitHub release tag (setup mode).
    value: ${{ steps.setup-unix.outputs.version || steps.setup-windows.outputs.version }}
  sha256:
    description: Verified SHA-256 of the executable (setup mode).
    value: ${{ steps.setup-unix.outputs.sha256 || steps.setup-windows.outputs.sha256 }}
  target:
    description: Resolved Rust target triple (setup mode).
    value: ${{ steps.setup-unix.outputs.target || steps.setup-windows.outputs.target }}
  transport:
    description: Transport directory that was packed and published (publish mode).
    value: ${{ steps.publish-unix.outputs.transport || steps.publish-windows.outputs.transport }}
  manifest:
    description: Manifest path inside the published transport (publish mode).
    value: ${{ steps.publish-unix.outputs.manifest || steps.publish-windows.outputs.manifest }}
  branch:
    description: Published branch name (publish mode).
    value: ${{ steps.publish-unix.outputs.branch || steps.publish-windows.outputs.branch }}

runs:
  using: composite
  steps:
    # `shell: bash` is available on Windows runners too, so the mode is validated once,
    # before any OS-specific step, and a typo fails with one clear message instead of
    # silently doing nothing.
    - id: mode
      shell: bash
      env:
        PIXI_SANDBOX_SUBPATH: ${{ inputs.subpath }}
      run: |
        set -euo pipefail
        case "$PIXI_SANDBOX_SUBPATH" in
          setup|publish)
            echo "mode=$PIXI_SANDBOX_SUBPATH" >> "$GITHUB_OUTPUT"
            ;;
          "")
            echo "::error::the 'subpath' input is required; use setup/action.yml or publish/action.yml" >&2
            exit 1
            ;;
          *)
            echo "::error::unknown subpath '$PIXI_SANDBOX_SUBPATH' (expected 'setup' or 'publish')" >&2
            exit 1
            ;;
        esac

    - id: setup-unix
      if: steps.mode.outputs.mode == 'setup' && runner.os != 'Windows'
      shell: bash
      env:
        SETUP_PIXI_SANDBOX_REPOSITORY: ${{ inputs.repository }}
        SETUP_PIXI_SANDBOX_VERSION: ${{ inputs.version }}
        SETUP_PIXI_SANDBOX_TARGET: ${{ inputs.target }}
        SETUP_PIXI_SANDBOX_ASSET_TEMPLATE: ${{ inputs.asset-template }}
        SETUP_PIXI_SANDBOX_CHECKSUMS_ASSET: ${{ inputs.checksums-asset }}
        SETUP_PIXI_SANDBOX_SHA256: ${{ inputs.sha256 }}
        SETUP_PIXI_SANDBOX_INSTALL_DIR: ${{ inputs.install-dir }}
        SETUP_PIXI_SANDBOX_ADD_TO_PATH: ${{ inputs.add-to-path }}
        SETUP_PIXI_SANDBOX_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        TARGET="${SETUP_PIXI_SANDBOX_TARGET}"
        if [ "$TARGET" = "auto" ] || [ -z "$TARGET" ]; then
          OS=$(uname -s)
          ARCH=$(uname -m)
          case "$OS-$ARCH" in
            Linux-x86_64)   TARGET="x86_64-unknown-linux-musl" ;;
            Linux-aarch64)  TARGET="aarch64-unknown-linux-musl" ;;
            Darwin-x86_64)  TARGET="x86_64-apple-darwin" ;;
            Darwin-arm64)   TARGET="aarch64-apple-darwin" ;;
            *) echo "::error::Unsupported OS/Arch: $OS-$ARCH" >&2; exit 1 ;;
          esac
        fi

        EXE=""
        VERSION="${SETUP_PIXI_SANDBOX_VERSION}"
        REPO="${SETUP_PIXI_SANDBOX_REPOSITORY}"

        ASSET_NAME="${SETUP_PIXI_SANDBOX_ASSET_TEMPLATE}"
        ASSET_NAME="${ASSET_NAME//\{target\}/$TARGET}"
        ASSET_NAME="${ASSET_NAME//\{exe\}/$EXE}"
        ASSET_NAME="${ASSET_NAME//\{version\}/$VERSION}"
        ASSET_NAME="${ASSET_NAME//\{tag\}/$VERSION}"

        INSTALL_DIR="${SETUP_PIXI_SANDBOX_INSTALL_DIR}"
        if [ -z "$INSTALL_DIR" ]; then
          INSTALL_DIR="${RUNNER_TEMP}/pixi-sandbox"
        fi
        mkdir -p "$INSTALL_DIR"

        AUTH_HEADER=()
        if [ -n "${SETUP_PIXI_SANDBOX_TOKEN}" ]; then
          AUTH_HEADER=(-H "Authorization: Bearer ${SETUP_PIXI_SANDBOX_TOKEN}")
        fi
        # Every expansion of this array is written `${AUTH_HEADER[@]+"${AUTH_HEADER[@]}"}`, not the
        # obvious `"${AUTH_HEADER[@]}"`. macOS runners still ship /bin/bash 3.2.57, and before bash
        # 4.4 an *empty* array expanded under `set -u` is an unbound-variable fatal error — so with
        # no token (the default, and what the airlock proof uses) the step died on its first curl
        # with a bare exit 1, before any of the `::error::` paths below could say why. Linux runners
        # carry bash 5 and never saw it. The `+` form yields nothing at all when the array is unset
        # or empty and is safe on both.

        if [ "$VERSION" = "latest" ]; then
          echo "::warning::setup-pixi-sandbox resolved a moving latest release; pin a tag in production."
          # Split from the parse below on purpose. This used to be one pipeline, so under
          # `pipefail` *any* response the grep could not find a tag in — an API rate-limit body is
          # the common one, unauthenticated calls are 60/hour per IP and hosted runners share
          # egress — exited the whole step with a bare 1 and no explanation. Both failure modes
          # now name themselves.
          if ! LATEST_JSON=$(curl -sSL --fail ${AUTH_HEADER[@]+"${AUTH_HEADER[@]}"} "https://api.github.com/repos/${REPO}/releases/latest"); then
            echo "::error::could not reach the releases API for ${REPO}; pass the token input or pin version to an immutable tag" >&2
            exit 1
          fi
          VERSION=$(printf '%s' "$LATEST_JSON" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$VERSION" ]; then
            echo "::error::the releases API answered for ${REPO} but carried no tag_name (rate limited?); pass the token input or pin version" >&2
            exit 1
          fi
        fi

        BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

        BIN_PATH="${INSTALL_DIR}/${ASSET_NAME}"
        curl -sSL ${AUTH_HEADER[@]+"${AUTH_HEADER[@]}"} -o "$BIN_PATH" "${BASE_URL}/${ASSET_NAME}"

        EXPECTED_SHA="${SETUP_PIXI_SANDBOX_SHA256}"
        if [ -z "$EXPECTED_SHA" ]; then
          CHECKSUMS_FILE="${RUNNER_TEMP}/SHA256SUMS"
          curl -sSL ${AUTH_HEADER[@]+"${AUTH_HEADER[@]}"} -o "$CHECKSUMS_FILE" "${BASE_URL}/${SETUP_PIXI_SANDBOX_CHECKSUMS_ASSET}"
          EXPECTED_SHA=$(grep -E "(^|[ /])${ASSET_NAME}$" "$CHECKSUMS_FILE" | awk '{print $1}' | tr -d '\r\n')
          if [ -z "$EXPECTED_SHA" ]; then
            EXPECTED_SHA=$(grep -E "\(${ASSET_NAME}\) = " "$CHECKSUMS_FILE" | awk -F'= ' '{print $2}' | tr -d '\r\n')
          fi
        fi

        if [ -z "$EXPECTED_SHA" ]; then
          echo "::error::Could not find checksum for ${ASSET_NAME}" >&2
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA=$(sha256sum "$BIN_PATH" | awk '{print $1}')
        else
          ACTUAL_SHA=$(shasum -a 256 "$BIN_PATH" | awk '{print $1}')
        fi

        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::Checksum mismatch! Expected: ${EXPECTED_SHA}, Actual: ${ACTUAL_SHA}" >&2
          exit 1
        fi

        FINAL_BIN="${INSTALL_DIR}/pixi-sandbox"
        cp "$BIN_PATH" "$FINAL_BIN"
        chmod +x "$FINAL_BIN"

        if [ "${SETUP_PIXI_SANDBOX_ADD_TO_PATH}" = "true" ]; then
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        fi

        "$FINAL_BIN" --version

        echo "path=$FINAL_BIN" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"

    - id: setup-windows
      if: steps.mode.outputs.mode == 'setup' && runner.os == 'Windows'
      shell: pwsh
      env:
        SETUP_PIXI_SANDBOX_REPOSITORY: ${{ inputs.repository }}
        SETUP_PIXI_SANDBOX_VERSION: ${{ inputs.version }}
        SETUP_PIXI_SANDBOX_TARGET: ${{ inputs.target }}
        SETUP_PIXI_SANDBOX_ASSET_TEMPLATE: ${{ inputs.asset-template }}
        SETUP_PIXI_SANDBOX_CHECKSUMS_ASSET: ${{ inputs.checksums-asset }}
        SETUP_PIXI_SANDBOX_SHA256: ${{ inputs.sha256 }}
        SETUP_PIXI_SANDBOX_INSTALL_DIR: ${{ inputs.install-dir }}
        SETUP_PIXI_SANDBOX_ADD_TO_PATH: ${{ inputs.add-to-path }}
        SETUP_PIXI_SANDBOX_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"

        $Target = $env:SETUP_PIXI_SANDBOX_TARGET
        if ([string]::IsNullOrWhiteSpace($Target) -or $Target -eq "auto") {
            $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
            if ($arch -eq "Arm64") {
                $Target = "aarch64-pc-windows-msvc"
            } else {
                $Target = "x86_64-pc-windows-msvc"
            }
        }

        $Exe = ".exe"
        $Version = $env:SETUP_PIXI_SANDBOX_VERSION
        $Repo = $env:SETUP_PIXI_SANDBOX_REPOSITORY

        $AssetName = $env:SETUP_PIXI_SANDBOX_ASSET_TEMPLATE
        $AssetName = $AssetName.Replace("{target}", $Target).Replace("{exe}", $Exe).Replace("{version}", $Version).Replace("{tag}", $Version)

        $InstallDir = $env:SETUP_PIXI_SANDBOX_INSTALL_DIR
        if ([string]::IsNullOrWhiteSpace($InstallDir)) {
            $InstallDir = Join-Path $env:RUNNER_TEMP "pixi-sandbox"
        }
        New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null

        $Headers = @{}
        if (![string]::IsNullOrWhiteSpace($env:SETUP_PIXI_SANDBOX_TOKEN)) {
            $Headers["Authorization"] = "Bearer $($env:SETUP_PIXI_SANDBOX_TOKEN)"
        }

        if ($Version -eq "latest") {
            Write-Warning "setup-pixi-sandbox resolved a moving latest release; pin a tag in production."
            $releaseJson = Invoke-RestMethod -Uri "https://api.github.com/repos/$Repo/releases/latest" -Headers $Headers
            $Version = $releaseJson.tag_name
        }

        $BaseUrl = "https://github.com/$Repo/releases/download/$Version"
        $BinPath = Join-Path $InstallDir $AssetName
        Invoke-WebRequest -Uri "$BaseUrl/$AssetName" -Headers $Headers -OutFile $BinPath

        $ExpectedSha = $env:SETUP_PIXI_SANDBOX_SHA256
        if ([string]::IsNullOrWhiteSpace($ExpectedSha)) {
            $SumsPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
            Invoke-WebRequest -Uri "$BaseUrl/$($env:SETUP_PIXI_SANDBOX_CHECKSUMS_ASSET)" -Headers $Headers -OutFile $SumsPath
            $match = Select-String -Path $SumsPath -Pattern $AssetName
            if ($match) {
                $line = $match.Line.Trim()
                if ($line -match "([0-9a-fA-F]{64})") {
                    $ExpectedSha = $matches[1].ToLower()
                }
            }
        }

        if ([string]::IsNullOrWhiteSpace($ExpectedSha)) {
            Write-Error "Could not find checksum for $AssetName"
            exit 1
        }

        $ActualSha = (Get-FileHash -Algorithm SHA256 $BinPath).Hash.ToLower()
        if ($ActualSha -ne $ExpectedSha.ToLower()) {
            Write-Error "Checksum mismatch! Expected $ExpectedSha, got $ActualSha"
            exit 1
        }

        $FinalBin = Join-Path $InstallDir "pixi-sandbox.exe"
        Copy-Item $BinPath $FinalBin -Force

        if ($env:SETUP_PIXI_SANDBOX_ADD_TO_PATH -eq "true") {
            $InstallDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        }

        & $FinalBin --version

        "path=$FinalBin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "sha256=$ActualSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "target=$Target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - id: publish-unix
      if: steps.mode.outputs.mode == 'publish' && runner.os != 'Windows'
      shell: bash
      env:
        PUBLISH_PIXI_SANDBOX_PROJECT: ${{ inputs.project }}
        PUBLISH_PIXI_SANDBOX_ENVIRONMENTS: ${{ inputs.environments }}
        PUBLISH_PIXI_SANDBOX_PLATFORM: ${{ inputs.platform }}
        PUBLISH_PIXI_SANDBOX_BRANCH: ${{ inputs.branch }}
        PUBLISH_PIXI_SANDBOX_CARGO_VENDOR: ${{ inputs.cargo-vendor }}
        PUBLISH_PIXI_SANDBOX_SELF_BIN: ${{ inputs.self-bin }}
        PUBLISH_PIXI_SANDBOX_REMOTE: ${{ inputs.remote }}
        PUBLISH_PIXI_SANDBOX_OUTPUT_DIR: ${{ inputs.output-dir }}
        PUBLISH_PIXI_SANDBOX_PUSH_TOKEN: ${{ inputs.push-token }}
        PUBLISH_PIXI_SANDBOX_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        # Publish inputs cannot be `required: true` in a shared manifest, so check them here.
        REQUIRED_INPUTS=(project environments platform branch self-bin remote output-dir)
        REQUIRED_VALUES=(
          "${PUBLISH_PIXI_SANDBOX_PROJECT}"
          "${PUBLISH_PIXI_SANDBOX_ENVIRONMENTS}"
          "${PUBLISH_PIXI_SANDBOX_PLATFORM}"
          "${PUBLISH_PIXI_SANDBOX_BRANCH}"
          "${PUBLISH_PIXI_SANDBOX_SELF_BIN}"
          "${PUBLISH_PIXI_SANDBOX_REMOTE}"
          "${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}"
        )
        for i in "${!REQUIRED_INPUTS[@]}"; do
          if [ -z "${REQUIRED_VALUES[$i]}" ]; then
            echo "::error::publish mode requires the '${REQUIRED_INPUTS[$i]}' input" >&2
            exit 1
          fi
        done

        IFS=',' read -ra ENVS <<< "${PUBLISH_PIXI_SANDBOX_ENVIRONMENTS}"
        for env_name in "${ENVS[@]}"; do
          env_name=$(echo "$env_name" | xargs)
          echo "Installing pixi environment: $env_name"
          (cd "${PUBLISH_PIXI_SANDBOX_PROJECT}" && pixi install --frozen -e "$env_name")
        done

        CARGO_VENDOR_FLAG=""
        if [ "${PUBLISH_PIXI_SANDBOX_CARGO_VENDOR}" = "true" ]; then
          CARGO_VENDOR_FLAG="--cargo-vendor"
        fi

        echo "Packing transport into ${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}..."
        "${PUBLISH_PIXI_SANDBOX_SELF_BIN}" pack \
          --repo-root "${PUBLISH_PIXI_SANDBOX_PROJECT}" \
          --envs "${PUBLISH_PIXI_SANDBOX_ENVIRONMENTS}" \
          --output-dir "${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}" \
          --platform "${PUBLISH_PIXI_SANDBOX_PLATFORM}" \
          --fetch-tools \
          --self-bin "${PUBLISH_PIXI_SANDBOX_SELF_BIN}" \
          $CARGO_VENDOR_FLAG

        echo "Running doctor verification..."
        "${PUBLISH_PIXI_SANDBOX_SELF_BIN}" doctor \
          --branch-location "${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}" \
          --verify

        if [ "${PUBLISH_PIXI_SANDBOX_DRY_RUN}" = "true" ]; then
          echo "::notice::dry-run: packed and verified '${PUBLISH_PIXI_SANDBOX_BRANCH}' but skipped the force-push; the orphan branch is unchanged."
        else
          echo "Publishing orphan branch ${PUBLISH_PIXI_SANDBOX_BRANCH}..."
          if [ -n "${PUBLISH_PIXI_SANDBOX_PUSH_TOKEN}" ]; then
            BASIC_AUTH=$(echo -n "x-access-token:${PUBLISH_PIXI_SANDBOX_PUSH_TOKEN}" | base64 | tr -d '\r\n')
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${BASIC_AUTH}"
          fi

          "${PUBLISH_PIXI_SANDBOX_SELF_BIN}" publish \
            --input-dir "${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}" \
            --branch-name "${PUBLISH_PIXI_SANDBOX_BRANCH}" \
            --remote "${PUBLISH_PIXI_SANDBOX_REMOTE}"
        fi

        echo "transport=${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
        echo "manifest=${PUBLISH_PIXI_SANDBOX_OUTPUT_DIR}/.pixi-sandbox/manifest.json" >> "$GITHUB_OUTPUT"
        echo "branch=${PUBLISH_PIXI_SANDBOX_BRANCH}" >> "$GITHUB_OUTPUT"

    - id: publish-windows
      if: steps.mode.outputs.mode == 'publish' && runner.os == 'Windows'
      shell: pwsh
      env:
        PUBLISH_PIXI_SANDBOX_PROJECT: ${{ inputs.project }}
        PUBLISH_PIXI_SANDBOX_ENVIRONMENTS: ${{ inputs.environments }}
        PUBLISH_PIXI_SANDBOX_PLATFORM: ${{ inputs.platform }}
        PUBLISH_PIXI_SANDBOX_BRANCH: ${{ inputs.branch }}
        PUBLISH_PIXI_SANDBOX_CARGO_VENDOR: ${{ inputs.cargo-vendor }}
        PUBLISH_PIXI_SANDBOX_SELF_BIN: ${{ inputs.self-bin }}
        PUBLISH_PIXI_SANDBOX_REMOTE: ${{ inputs.remote }}
        PUBLISH_PIXI_SANDBOX_OUTPUT_DIR: ${{ inputs.output-dir }}
        PUBLISH_PIXI_SANDBOX_PUSH_TOKEN: ${{ inputs.push-token }}
        PUBLISH_PIXI_SANDBOX_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        $ErrorActionPreference = "Stop"

        # Publish inputs cannot be `required: true` in a shared manifest, so check them here.
        $required = [ordered]@{
            "project"     = $env:PUBLISH_PIXI_SANDBOX_PROJECT
            "environments" = $env:PUBLISH_PIXI_SANDBOX_ENVIRONMENTS
            "platform"    = $env:PUBLISH_PIXI_SANDBOX_PLATFORM
            "branch"      = $env:PUBLISH_PIXI_SANDBOX_BRANCH
            "self-bin"    = $env:PUBLISH_PIXI_SANDBOX_SELF_BIN
            "remote"      = $env:PUBLISH_PIXI_SANDBOX_REMOTE
            "output-dir"  = $env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR
        }
        foreach ($key in $required.Keys) {
            if ([string]::IsNullOrWhiteSpace($required[$key])) {
                Write-Error "publish mode requires the '$key' input"
                exit 1
            }
        }

        $envs = $env:PUBLISH_PIXI_SANDBOX_ENVIRONMENTS -split ','
        foreach ($e in $envs) {
            $e = $e.Trim()
            Push-Location $env:PUBLISH_PIXI_SANDBOX_PROJECT
            try {
                & pixi install --frozen -e $e
            } finally {
                Pop-Location
            }
        }

        $packArgs = @(
            "pack",
            "--repo-root", $env:PUBLISH_PIXI_SANDBOX_PROJECT,
            "--envs", $env:PUBLISH_PIXI_SANDBOX_ENVIRONMENTS,
            "--output-dir", $env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR,
            "--platform", $env:PUBLISH_PIXI_SANDBOX_PLATFORM,
            "--fetch-tools",
            "--self-bin", $env:PUBLISH_PIXI_SANDBOX_SELF_BIN
        )

        if ($env:PUBLISH_PIXI_SANDBOX_CARGO_VENDOR -eq "true") {
            $packArgs += "--cargo-vendor"
        }

        & $env:PUBLISH_PIXI_SANDBOX_SELF_BIN @packArgs

        & $env:PUBLISH_PIXI_SANDBOX_SELF_BIN doctor --branch-location $env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR --verify

        if ($env:PUBLISH_PIXI_SANDBOX_DRY_RUN -eq "true") {
            Write-Output "::notice::dry-run: packed and verified '$($env:PUBLISH_PIXI_SANDBOX_BRANCH)' but skipped the force-push; the orphan branch is unchanged."
        } else {
            if (![string]::IsNullOrWhiteSpace($env:PUBLISH_PIXI_SANDBOX_PUSH_TOKEN)) {
                $bytes = [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$($env:PUBLISH_PIXI_SANDBOX_PUSH_TOKEN)")
                $basic = [System.Convert]::ToBase64String($bytes)
                $env:GIT_CONFIG_COUNT = "1"
                $env:GIT_CONFIG_KEY_0 = "http.extraheader"
                $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
            }

            & $env:PUBLISH_PIXI_SANDBOX_SELF_BIN publish --input-dir $env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR --branch-name $env:PUBLISH_PIXI_SANDBOX_BRANCH --remote $env:PUBLISH_PIXI_SANDBOX_REMOTE
        }

        "transport=$($env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "manifest=$($env:PUBLISH_PIXI_SANDBOX_OUTPUT_DIR)/.pixi-sandbox/manifest.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "branch=$($env:PUBLISH_PIXI_SANDBOX_BRANCH)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
