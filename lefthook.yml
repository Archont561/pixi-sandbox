# lefthook — local git hooks. Every hook calls a pixi task so hooks and CI cannot drift.
# https://lefthook.dev
#
# Only *staged* files are considered: the `glob` filters, and `stage_fixed: true`
# re-stages whatever a formatter rewrote.

min_version: "2.0.0"

pre-commit:
  parallel: true
  jobs:
    - name: rust-fmt
      glob: "*.rs"
      run: pixi run fmt
      stage_fixed: true

    - name: rust-clippy
      glob: "{**/*.rs,Cargo.toml,crates/**/Cargo.toml}"
      run: pixi run lint-rust

    - name: toml-fmt
      glob: "*.toml"
      run: pixi run -- taplo fmt {staged_files}
      stage_fixed: true

    - name: docs-biome
      glob: "docs/**/*.{js,ts,mjs,cjs,json,jsonc,astro}"
      # biome lives in the `web` environment (a package.json devDependency), so the hook names it
      # the same way the `lint-docs` task does rather than assuming it is on the default PATH.
      run: pixi run lint-docs-write -- {staged_files}
      stage_fixed: true

    - name: workflows
      glob: ".github/workflows/*.{yml,yaml}"
      run: pixi run lint-actions

    - name: repo-consistency
      # the README badge, the workspace platforms and the publish plan tell one platform story,
      # and crates/ never points at the prototype deleted in 0.2.0
      glob: "{README.md,pixi.toml,.pixi-sandbox.toml,crates/**/*.rs,crates/**/*.md}"
      run: pixi run lint-repo-consistency

    - name: manifest-schema
      # the manifest shape is a wire format: changing it needs a schema bump + a fixture update
      glob: "{crates/pixi-sandbox-core/src/manifest.rs,crates/pixi-sandbox-core/tests/manifest.rs}"
      run: pixi run cargo test -p pixi-sandbox-core --test manifest

commit-msg:
  jobs:
    - name: convco
      # `{1}` is the file holding the proposed message (git commit-msg hook argument)
      run: pixi run lint-commit < {1}

pre-push:
  jobs:
    - name: tests
      run: pixi run test
