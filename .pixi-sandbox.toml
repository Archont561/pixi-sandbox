# Reviewed publish plan consumed by `pixi-sandbox plan` and the release-binary reusable workflow.
# Add a target only after its native runner and standalone Rust bootstrap artifact have passed
# the airlock proof (D11). Declaring a platform here *is* what schedules that proof: the
# `pull_request` trigger in .github/workflows/airlock.yml runs `plan --json` over this file and
# fans the matrix out onto each platform's native runner, egress-denied tier included. So a new
# target lands as a PR that must stay red-free on its own runner before it is merged — the gate
# is the review, not the edit. linux-64 has been validated since 0.1.0; osx-arm64 is being
# proven by the PR that added this line (task-1).
schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64", "osx-arm64"]
