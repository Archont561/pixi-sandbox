# Reviewed publish plan consumed by `pixi-sandbox plan` and the release-binary reusable workflow.
# Add a target only after its native runner and standalone Rust bootstrap artifact have passed
# the airlock proof (ADR-11). Declaring a platform here *is* what schedules that proof: the
# `pull_request` trigger in .github/workflows/airlock.yml runs `plan --json` over this file and
# fans the matrix out onto each platform's native runner, egress-denied tier included. So a new
# target lands as a PR that must stay red-free on its own runner before it is merged — the gate
# is the review, not the edit. linux-64 has been validated since 0.1.0. osx-arm64 was proven under
# task-1 and stays a supported target (it is still declared in `pixi.toml` and the README badge),
# but it is intentionally left out of the routine publish plan below: its native-runner pack +
# publish adds ~30 minutes to every push to main for a bundle that rarely changes. Re-add it here
# to schedule the macOS proof/publish again (subset-of-`pixi.toml` is all the consistency lint
# requires, so dropping it here does not touch the badge or the workspace platform list).
schema = 1
branch_prefix = "sandbox"
# Vendored crates are a *distribution* property: `sandbox/developer-<platform>` ships the
# registry sources so a consumer can `cargo build` with no network, and the publisher on `main`
# is the only workflow that packs such a transport. The airlock proof deliberately does not
# (`AIRLOCK_CARGO_VENDOR: false` in .github/workflows/airlock.yml): it replays a prebuilt
# nextest archive in the restored tree and never compiles there, so the vendor cost pack,
# publish and restore time without ever being read. Keeping the value `true` here is what the
# publish workflow consumes from `plan --json`.
cargo_vendor = true

# Hard publish budgets enforced by `doctor --budget-config` in the publisher before a branch is
# force-pushed. Split a growing transport by adding another [[bundle]] environment set; do not
# split one environment or move payloads outside the self-contained branch.
[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

# CI policy for the generated publisher (task-53). Every field below is decided on purpose,
# because the *presence* of this table alone moves `push_paths` and `setup_pixi_cache` to new
# defaults (decision ADR-18) — both are therefore written out explicitly rather than inherited.
[workflow]
# Explicit, not derived. The derivation (`derive_push_paths`) would yield the seven manifest and
# lock files below and nothing else; this repository's publisher additionally builds the
# pixi-sandbox binary it packs as the transport bootstrap *from the checked-out source*, so a
# change to a crate that links into that binary really does change the transport and must
# repack. Those crates are listed individually: `crates/xtask/**` is repository automation and is
# not a dependency of `pixi-sandbox` (`crates/pixi-sandbox/Cargo.toml` names only `-core` and
# `-git`), so an xtask-only merge used to rebuild and repack a 1.2 GB transport for a binary
# byte-identical to the one already published — the whole 249 s of run 40113894031 for a merge
# that changed nothing the transport carries, against 38 s of planning. A release commit still
# fires the publisher: `prepare-release` rewrites Cargo.toml, pixi.toml and
# Cargo.lock (verified against its own `.release-touched` report), which is what the deleted
# auto-release dispatch used to guarantee by hand after the v0.4.2 stale-transport incident.
push_paths = [
  ".pixi-sandbox.toml",
  "Cargo.lock",
  "Cargo.toml",
  "bun.lock",
  "crates/pixi-sandbox-core/**",
  "crates/pixi-sandbox-git/**",
  "crates/pixi-sandbox/**",
  "package.json",
  "pixi.lock",
  "pixi.toml",
]
# ADR-18's default, taken deliberately: `setup-pixi` runs with `run-install: false` here, so its
# cache would be keyed on this manifest without holding the environments the publish job then
# installs itself with `pixi install --frozen`.
setup_pixi_cache = false

# One repack at a time. The publish job force-pushes the orphan transport branch
# (`crates/pixi-sandbox-git/src/shell.rs`, `git push --force`), so two overlapping runs are two
# concurrent force-pushes to one ref — the transport-inconsistency class task-44 fixed. The group
# is repository-wide rather than per-ref (auto-release.yml's shape, not ci.yml's) because the
# contended resource is the transport branch, which every run of this workflow writes regardless
# of the ref it started from.
#
# `cancel_in_progress = false`: never abort a pack/verify/push mid-flight. Note what GitHub
# actually guarantees — not a FIFO queue but at most one running plus one pending run, where a
# newly queued run cancels the older *pending* one. That is the wanted behaviour here (a
# superseded pending repack is redundant: the newer run packs from newer main), but it does mean
# `false` is not a promise that every push publishes.
[workflow.concurrency]
group = "publish-sandbox-${{ github.repository }}"
cancel_in_progress = false

[[bundle]]
name = "developer"
# One prefix now carries Rust, Bun and repository utilities so the restored developer runs the
# same Pixi → Turbo → package command path as CI; Cargo dependencies remain separately vendored.
environments = ["default"]
platforms = ["linux-64"]
