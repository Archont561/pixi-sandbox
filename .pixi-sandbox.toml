# Reviewed publish plan consumed by `pixi-sandbox plan` and the release-binary reusable workflow.
# Add a target only after its native runner and standalone Rust bootstrap artifact have passed
# the airlock proof (D11). Declaring a platform here *is* what schedules that proof: the
# `pull_request` trigger in .github/workflows/airlock.yml runs `plan --json` over this file and
# fans the matrix out onto each platform's native runner, egress-denied tier included. So a new
# target lands as a PR that must stay red-free on its own runner before it is merged — the gate
# is the review, not the edit. linux-64 has been validated since 0.1.0. osx-arm64 was proven under
# task-1 and stays a supported target (it is still declared in `pixi.toml` and the README badge),
# but it is intentionally left out of the routine publish plan below: its native-runner pack +
# publish adds ~30 minutes to every push to main for a bundle that rarely changes. Re-add it here
# to schedule the macOS proof/publish again (subset-of-`pixi.toml` is all the consistency lint
# requires, so dropping it here does not touch the badge or the workspace platform list).
schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

# Hard publish budgets enforced by `doctor --budget-config` in the publisher before a branch is
# force-pushed. Split a growing transport by adding another [[bundle]] environment set; do not
# split one environment or move payloads outside the self-contained branch.
[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

[[bundle]]
name = "developer"
# One prefix now carries Rust, Bun and repository utilities so the restored developer runs the
# same Pixi → Turbo → package command path as CI; Cargo dependencies remain separately vendored.
environments = ["default"]
platforms = ["linux-64"]
